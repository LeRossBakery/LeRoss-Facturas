<body class="selection:bg-brand-pink/20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const BANK_DETAILS = `LeRoss Bakery — Cuentas para Transferencias 🧁\n\n• Banco Popular Corriente:\n000-000000-0\n• Banreservas Corriente:\n000-000000-0\n• BHD Corriente:\n000-000000-0\n\nA nombre de: Rosnellys Matos Guzmán\nPor favor enviar comprobante por este chat.`;

    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatWholeRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    };

    const playOrderChime = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    };

    function App() {
      const [tab, setTab] = useState("invoices"); // invoices, customers, menu, finances, simulator
      const [cloudStatus, setCloudStatus] = useState("connecting");
      const [toastMsg, setToastMsg] = useState("");
      const [isAjustesOpen, setIsAjustesOpen] = useState(false);

      const [data, setData] = useState({
        invoices: [],
        products: [],
        customers: [],
        expenses: [],
        simulations: [],
        webOrders: []
      });

      const prevOrdersCount = useRef(0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const handleCopyBank = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(BANK_DETAILS);
          showToast("Datos bancarios copiados al portapapeles");
        } else {
          showToast("No se pudo copiar automáticamente");
        }
      };

      useEffect(() => {
        if (!db) {
          setCloudStatus("offline");
          return;
        }

        const unsubscribe = db.collection("leross_app").doc("main_data").onSnapshot(
          (doc) => {
            if (doc.exists) {
              const res = doc.data();
              const orders = res.webOrders || [];
              const pendingCount = orders.filter(o => o.status === "Pendiente").length;

              if (prevOrdersCount.current !== 0 && pendingCount > prevOrdersCount.current) {
                playOrderChime();
                showToast("🔔 ¡Nuevo pedido web entrante!");
              }
              prevOrdersCount.current = pendingCount;

              setData({
                invoices: res.invoices || [],
                products: res.products || [],
                customers: res.customers || [],
                expenses: res.expenses || [],
                simulations: res.simulations || [],
                webOrders: orders
              });
              setCloudStatus("synced");
            } else {
              setCloudStatus("empty");
            }
          },
          (err) => {
            console.error("Firestore sync error:", err);
            setCloudStatus("error");
          }
        );

        return () => unsubscribe();
      }, []);

      // MAPEO EXACTO Y SEGURO DE NÚMEROS DE FACTURA (CORRIGE inv_179...)
      const sortedChronologicalInvoices = useMemo(() => {
        return [...(data.invoices || [])].sort((a, b) => {
          const tA = a.createdAt || a.date || "";
          const tB = b.createdAt || b.date || "";
          return tA.localeCompare(tB);
        });
      }, [data.invoices]);

      const getInvoiceDisplayNumber = (inv) => {
        if (inv.number && /^FAC-\d+/.test(inv.number)) return inv.number;
        if (inv.id && /^FAC-\d+/.test(inv.id)) return inv.id;

        const idx = sortedChronologicalInvoices.findIndex(item => item.id === inv.id);
        if (idx !== -1) {
          return "FAC-" + String(idx + 1).padStart(4, "0");
        }
        return "FAC-0001";
      };

      const nextInvoiceNumber = useMemo(() => {
        const maxNum = (data.invoices || []).reduce((max, inv) => {
          const match = (inv.number || "").match(/FAC-(\d+)/) || (inv.id || "").match(/FAC-(\d+)/);
          const num = match ? parseInt(match[1], 10) : 0;
          return Math.max(max, num);
        }, 0);

        const count = Math.max(maxNum, (data.invoices || []).length);
        return "FAC-" + String(count + 1).padStart(4, "0");
      }, [data.invoices]);

      // Métricas Superiores
      const topMetrics = useMemo(() => {
        const validInvoices = (data.invoices || []).filter(inv => inv.state !== "Anulada");
        const totalFacturado = validInvoices.reduce((acc, inv) => acc + Number(inv.calculation?.total || inv.total || 0), 0);
        const totalPorCobrar = validInvoices
          .filter(inv => inv.paymentStatus === "Pendiente")
          .reduce((acc, inv) => acc + Number(inv.calculation?.total || inv.total || 0), 0);

        return { totalFacturado, totalPorCobrar };
      }, [data.invoices]);

      // Pedidos Web Pendientes
      const pendingWebOrders = useMemo(() => {
        return (data.webOrders || []).filter(o => o.status === "Pendiente");
      }, [data.webOrders]);

      const handleAcceptWebOrder = async (order) => {
        const definiteNumber = nextInvoiceNumber;
        const subtotal = Number(order.subtotal || 0);

        const newInvoice = {
          id: definiteNumber,
          number: definiteNumber,
          sourceOrderId: order.id,
          date: new Date().toISOString().split("T")[0],
          customer: {
            name: order.customerName || "Cliente",
            phone: order.customerPhone || "",
            address: order.deliveryAddress || ""
          },
          deliveryDate: order.deliveryDate || "",
          deliveryTime: order.deliveryTime || "",
          items: (order.items || []).map(it => ({
            name: it.name,
            quantity: Number(it.quantity || 1),
            price: Number(it.price || 0),
            total: Number(it.total || (it.price * it.quantity))
          })),
          shippingFee: 0,
          calculation: { subtotal, total: subtotal },
          paymentStatus: "Pendiente",
          state: "Válida",
          notes: order.specialNotes || "",
          createdAt: new Date().toISOString()
        };

        const updatedOrders = (data.webOrders || []).map(o => {
          if (o.id === order.id) {
            return { ...o, status: "Confirmada", assignedInvoiceId: definiteNumber };
          }
          return o;
        });

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              invoices: [newInvoice, ...(data.invoices || [])],
              webOrders: updatedOrders
            });
            showToast(`✓ Pedido ${order.id} convertido a ${definiteNumber}`);
            setViewingInvoice(newInvoice);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleRejectWebOrder = async (orderId) => {
        if (!confirm("¿Deseas rechazar este pedido web?")) return;
        const updated = (data.webOrders || []).map(o => o.id === orderId ? { ...o, status: "Rechazada" } : o);
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ webOrders: updated });
            showToast("Pedido rechazado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Filtro y Búsqueda
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("Pendientes"); // Pendientes, Todas, Pagadas, Anuladas
      const [viewingInvoice, setViewingInvoice] = useState(null);
      const [isCreatingInvoice, setIsCreatingInvoice] = useState(false);

      const filteredInvoices = useMemo(() => {
        return (data.invoices || []).filter(inv => {
          const displayNum = getInvoiceDisplayNumber(inv).toLowerCase();
          const custName = (inv.customer?.name || inv.customerName || inv.clientName || "").toLowerCase();
          const q = searchQuery.toLowerCase().trim();

          const matchesQuery = !q || displayNum.includes(q) || custName.includes(q);
          if (!matchesQuery) return false;

          if (statusFilter === "Pendientes") return inv.paymentStatus === "Pendiente" && inv.state !== "Anulada";
          if (statusFilter === "Pagadas") return inv.paymentStatus === "Pagada" && inv.state !== "Anulada";
          if (statusFilter === "Anuladas") return inv.state === "Anulada";
          return true;
        });
      }, [data.invoices, searchQuery, statusFilter, sortedChronologicalInvoices]);

      // Formulario Nueva Factura
      const [invCustomerName, setInvCustomerName] = useState("");
      const [invCustomerPhone, setInvCustomerPhone] = useState("");
      const [invDeliveryDate, setInvDeliveryDate] = useState("");
      const [invPaymentStatus, setInvPaymentStatus] = useState("Pendiente");
      const [invItems, setInvItems] = useState([{ id: 1, name: "", quantity: 1, price: 0, total: 0 }]);

      const addInvoiceLine = () => {
        setInvItems(prev => [...prev, { id: Date.now(), name: "", quantity: 1, price: 0, total: 0 }]);
      };

      const updateInvoiceLine = (id, field, val) => {
        setInvItems(prev => prev.map(line => {
          if (line.id === id) {
            const updated = { ...line, [field]: val };
            if (field === 'name') {
              const p = (data.products || []).find(prod => prod.name.toLowerCase() === String(val).toLowerCase());
              if (p) {
                updated.price = p.price;
                updated.total = Number(updated.quantity || 1) * p.price;
              }
            }
            if (field === 'price' || field === 'quantity') {
              updated.total = Number(updated.quantity || 0) * Number(updated.price || 0);
            }
            return updated;
          }
          return line;
        }));
      };

      const removeInvoiceLine = (id) => {
        if (invItems.length <= 1) return;
        setInvItems(prev => prev.filter(i => i.id !== id));
      };

      const handleSaveManualInvoice = async (e) => {
        e.preventDefault();
        if (!invCustomerName.trim()) return alert("Indica el nombre del cliente.");

        const definiteNumber = nextInvoiceNumber;
        const subtotal = invItems.reduce((acc, it) => acc + (Number(it.total) || 0), 0);

        const newInv = {
          id: definiteNumber,
          number: definiteNumber,
          date: new Date().toISOString().split("T")[0],
          customer: {
            name: invCustomerName.trim(),
            phone: invCustomerPhone.trim()
          },
          deliveryDate: invDeliveryDate,
          items: invItems.filter(it => it.name.trim() !== ""),
          shippingFee: 0,
          calculation: { subtotal, total: subtotal },
          paymentStatus: invPaymentStatus,
          state: "Válida",
          createdAt: new Date().toISOString()
        };

        const customerList = [...(data.customers || [])];
        const existingIdx = customerList.findIndex(c => c.name.toLowerCase() === newInv.customer.name.toLowerCase());
        if (existingIdx >= 0) {
          customerList[existingIdx] = { ...customerList[existingIdx], ...newInv.customer };
        } else {
          customerList.push({ id: "cust_" + Date.now(), ...newInv.customer });
        }

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              invoices: [newInv, ...(data.invoices || [])],
              customers: customerList
            });
            setIsCreatingInvoice(false);
            setInvCustomerName("");
            setInvCustomerPhone("");
            setInvItems([{ id: 1, name: "", quantity: 1, price: 0, total: 0 }]);
            showToast(`Factura ${definiteNumber} emitida`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Actualizar estado de factura mediante dropdown
      const handleUpdateInvoiceStatus = async (invId, newStatus) => {
        const isAnulada = newStatus === "Anulada";
        const updated = (data.invoices || []).map(i => {
          if (i.id === invId) {
            return {
              ...i,
              state: isAnulada ? "Anulada" : "Válida",
              paymentStatus: isAnulada ? i.paymentStatus : newStatus
            };
          }
          return i;
        });

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ invoices: updated });
            showToast(`Estado actualizado: ${newStatus}`);
            if (viewingInvoice && viewingInvoice.id === invId) {
              setViewingInvoice(prev => ({
                ...prev,
                state: isAnulada ? "Anulada" : "Válida",
                paymentStatus: isAnulada ? prev.paymentStatus : newStatus
              }));
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleSendInvoiceWhatsApp = (inv) => {
        const dispId = getInvoiceDisplayNumber(inv);
        let msg = `*LeRoss Bakery — Factura Oficial ${dispId}* 🧁\n\n`;
        if (inv.sourceOrderId) msg += `📋 *Referencia:* ${inv.sourceOrderId}\n`;
        msg += `👤 *Cliente:* ${inv.customer?.name || inv.customerName || "Cliente"}\n`;
        msg += `📅 *Fecha:* ${formatDate(inv.date)}\n`;
        if (inv.deliveryDate) msg += `🚗 *Entrega:* ${formatDate(inv.deliveryDate)}\n`;
        msg += `\n*Detalle de Postres:*\n`;
        (inv.items || []).forEach(it => {
          msg += `• ${it.quantity}x ${it.name} — ${formatRD(it.total)}\n`;
        });
        if (Number(inv.shippingFee) > 0) {
          msg += `• Envío a Domicilio — ${formatRD(inv.shippingFee)}\n`;
        }
        msg += `\n💰 *Total:* ${formatRD(inv.calculation?.total || inv.total)}\n`;
        msg += `📌 *Estado de Pago:* ${inv.paymentStatus === 'Pagada' ? 'PAGADA ✓' : 'PENDIENTE'}\n\n`;
        msg += `¡Muchas gracias por preferir a LeRoss Bakery!`;

        const phone = (inv.customer?.phone || "").replace(/\D/g, "");
        const url = phone ? `https://wa.me/1${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, "_blank");
      };

      // Catálogo Menú
      const [isAddingProduct, setIsAddingProduct] = useState(false);
      const [prodName, setProdName] = useState("");
      const [prodCategory, setProdCategory] = useState("Tres Leches");
      const [prodPrice, setProdPrice] = useState("");
      const [prodImage, setProdImage] = useState("");

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 800;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, width, height);
            setProdImage(canvas.toDataURL("image/jpeg", 0.82));
            showToast("Foto optimizada (800x800)");
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodName.trim()) return alert("Indica el nombre.");
        if (Number(prodPrice) <= 0) return alert("Indica un precio válido.");

        const newP = {
          id: "prod_" + Date.now(),
          name: prodName.trim(),
          category: prodCategory,
          price: Number(prodPrice),
          image: prodImage,
          available: true
        };

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              products: [newP, ...(data.products || [])]
            });
            setIsAddingProduct(false);
            setProdName("");
            setProdPrice("");
            setProdImage("");
            showToast("Postre guardado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleToggleProductAvailability = async (prodId, current) => {
        const updated = (data.products || []).map(p => p.id === prodId ? { ...p, available: !current } : p);
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ products: updated });
            showToast("Disponibilidad actualizada");
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Finanzas
      const [expenseDate, setExpenseDate] = useState(new Date().toISOString().split("T")[0]);
      const [expenseCategory, setExpenseCategory] = useState("Ingredientes");
      const [expenseDescription, setExpenseDescription] = useState("");
      const [expenseAmount, setExpenseAmount] = useState("");

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const amt = Number(expenseAmount);
        if (!amt || amt <= 0) return alert("Indica un monto válido.");
        if (!expenseDescription.trim()) return alert("Indica una descripción.");

        const newExp = {
          id: "exp_" + Date.now(),
          date: expenseDate,
          category: expenseCategory,
          description: expenseDescription.trim(),
          amount: amt,
          createdAt: new Date().toISOString()
        };

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              expenses: [newExp, ...(data.expenses || [])]
            });
            setExpenseDescription("");
            setExpenseAmount("");
            showToast("Gasto guardado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleDeleteExpense = async (expId) => {
        if (!confirm("¿Eliminar este gasto?")) return;
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              expenses: (data.expenses || []).filter(e => e.id !== expId)
            });
            showToast("Gasto eliminado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const financialSummary = useMemo(() => {
        const grossPaid = (data.invoices || [])
          .filter(i => i.state !== "Anulada" && i.paymentStatus === "Pagada")
          .reduce((acc, i) => acc + Number(i.calculation?.total || i.total || 0), 0);

        const totalExpenses = (data.expenses || []).reduce((acc, e) => acc + Number(e.amount || 0), 0);
        const operatingIncome = grossPaid - totalExpenses;
        const marginPct = grossPaid > 0 ? Math.round((operatingIncome / grossPaid) * 100) : 0;

        return { grossPaid, totalExpenses, operatingIncome, marginPct };
      }, [data.invoices, data.expenses]);

      // Simulador de Costos
      const [simMode, setSimMode] = useState("batch");
      const [bowlCost, setBowlCost] = useState("1054");
      const [batchItems, setBatchItems] = useState([
        { id: 1, name: "Bizcocho 1 lb", quantity: 1, sellingPrice: 2700, packagingCost: 180 },
        { id: 2, name: "Bizcocho Personal", quantity: 2, sellingPrice: 350, packagingCost: 40 }
      ]);

      const updateBatchItem = (id, f, val) => {
        setBatchItems(prev => prev.map(it => it.id === id ? { ...it, [f]: val } : it));
      };

      const addBatchItem = () => {
        setBatchItems(prev => [...prev, { id: Date.now(), name: "Nuevo Tamaño", quantity: 1, sellingPrice: 500, packagingCost: 50 }]);
      };

      const removeBatchItem = (id) => {
        if (batchItems.length <= 1) return;
        setBatchItems(prev => prev.filter(i => i.id !== id));
      };

      const batchMetrics = useMemo(() => {
        const rawCost = Number(bowlCost || 0);
        let rev = 0;
        let pkg = 0;

        batchItems.forEach(it => {
          rev += Number(it.quantity || 1) * Number(it.sellingPrice || 0);
          pkg += Number(it.quantity || 1) * Number(it.packagingCost || 0);
        });

        const itemsAllocated = batchItems.map(it => {
          const q = Number(it.quantity || 1);
          const p = Number(it.sellingPrice || 0);
          const groupRev = q * p;
          const share = rev > 0 ? (groupRev / rev) : 0;
          const batterCostUnit = q > 0 ? ((rawCost * share) / q) : 0;
          const totalCostUnit = batterCostUnit + Number(it.packagingCost || 0);
          const profit = p - totalCostUnit;
          const margin = p > 0 ? Math.round((profit / p) * 100) : 0;

          return { ...it, batterCostUnit, totalCostUnit, profit, margin };
        });

        const totalCost = rawCost + pkg;
        const totalProfit = rev - totalCost;
        const totalMargin = rev > 0 ? Math.round((totalProfit / rev) * 100) : 0;

        return { rev, totalCost, totalProfit, totalMargin, itemsAllocated };
      }, [bowlCost, batchItems]);

          {/* PESTAÑA: FINANZAS                                        */}
          {/* ======================================================== */}
          {tab === "finances" && (
            <div className="space-y-4 pt-1 animate-in fade-in duration-150">
              <div className="bg-gradient-to-br from-brand-charcoal to-[#2D2D2D] p-5 rounded-3xl text-white shadow-md space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] text-white/60 uppercase tracking-widest font-semibold block">Utilidad Operativa</span>
                    <span className="text-2xl font-black mt-0.5 block">{formatRD(financialSummary.operatingIncome)}</span>
                  </div>
                  <div className="bg-white/10 px-2.5 py-1 rounded-full text-xs font-bold text-emerald-400">
                    {financialSummary.marginPct}% Margen
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2 border-t border-white/10 text-xs">
                  <div>
                    <span className="text-white/60 block text-[10.5px]">Cobrado:</span>
                    <span className="font-bold text-emerald-400 text-sm">+{formatRD(financialSummary.grossPaid)}</span>
                  </div>
                  <div>
                    <span className="text-white/60 block text-[10.5px]">Gastos:</span>
                    <span className="font-bold text-rose-400 text-sm">-{formatRD(financialSummary.totalExpenses)}</span>
                  </div>
                </div>
              </div>

              {/* Registrar Compra */}
              <form onSubmit={handleAddExpense} className="bg-white p-4 rounded-2xl border border-gray-100 space-y-2.5 shadow-2xs">
                <h3 className="text-xs font-bold text-gray-900">Registrar Compra / Gasto</h3>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="date"
                    value={expenseDate}
                    onChange={e => setExpenseDate(e.target.value)}
                    className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs outline-none"
                  />
                  <select
                    value={expenseCategory}
                    onChange={e => setExpenseCategory(e.target.value)}
                    className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs outline-none font-semibold"
                  >
                    <option value="Ingredientes">🛒 Ingredientes</option>
                    <option value="Empaques">📦 Empaques</option>
                    <option value="Operativo">⚡ Servicios</option>
                  </select>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <input
                    type="text"
                    placeholder="Descripción"
                    value={expenseDescription}
                    onChange={e => setExpenseDescription(e.target.value)}
                    className="col-span-2 bg-[#FAF7F8] border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs outline-none"
                  />
                  <input
                    type="number"
                    placeholder="RD$"
                    value={expenseAmount}
                    onChange={e => setExpenseAmount(e.target.value)}
                    className="col-span-1 bg-[#FAF7F8] border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-rose-600 outline-none"
                  />
                </div>

                <button type="submit" className="w-full bg-brand-charcoal text-white text-xs font-bold py-2 rounded-xl">
                  + Guardar Gasto
                </button>
              </form>

              {/* Compras Recientes */}
              <div className="bg-white p-4 rounded-2xl border border-gray-100 space-y-2 shadow-2xs">
                <span className="text-xs font-bold text-gray-900 block">Compras Registradas</span>
                <div className="divide-y divide-gray-100">
                  {(data.expenses || []).map(exp => (
                    <div key={exp.id} className="py-2 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-semibold text-gray-800">{exp.description}</span>
                        <span className="text-[10px] text-gray-400 block">{formatDate(exp.date)} · {exp.category}</span>
                      </div>
                      <div className="flex items-center space-x-2">
                        <span className="font-bold text-rose-600">-{formatRD(exp.amount)}</span>
                        <button onClick={() => handleDeleteExpense(exp.id)} className="text-gray-400 hover:text-rose-500">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* PESTAÑA: SIMULADOR DE COSTOS                             */}
          {/* ======================================================== */}
          {tab === "simulator" && (
            <div className="space-y-4 pt-1 animate-in fade-in duration-150">
              <div className="p-1 bg-[#FDECEF] rounded-2xl flex space-x-1">
                <button
                  onClick={() => setSimMode("batch")}
                  className={`flex-1 py-1.5 text-xs font-bold rounded-xl ${simMode === 'batch' ? 'bg-brand-pink text-white shadow-xs' : 'text-[#D46B84]'}`}
                >
                  🥣 Tanda Compartida
                </button>
                <button
                  onClick={() => setSimMode("single")}
                  className={`flex-1 py-1.5 text-xs font-bold rounded-xl ${simMode === 'single' ? 'bg-brand-pink text-white shadow-xs' : 'text-[#D46B84]'}`}
                >
                  🍰 Postre Individual
                </button>
              </div>

              {simMode === "batch" && (
                <div className="space-y-3">
                  <div className="bg-white p-4 rounded-2xl border border-gray-100 space-y-2 shadow-2xs">
                    <span className="text-xs font-bold text-gray-900 block">Costo de Materia Prima en Tazón</span>
                    <input
                      type="number"
                      placeholder="1054"
                      value={bowlCost}
                      onChange={e => setBowlCost(e.target.value)}
                      className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-3 py-2 text-xs font-black text-[#D46B84] outline-none"
                    />
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-gray-100 space-y-2.5 shadow-2xs">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-gray-900">Moldes Horneados</span>
                      <button onClick={addBatchItem} className="text-[11px] font-bold text-[#D46B84]">+ Añadir Molde</button>
                    </div>

                    {batchMetrics.itemsAllocated.map((it) => (
                      <div key={it.id} className="p-3 rounded-xl bg-[#FAF7F8] border border-gray-200 space-y-2 text-xs">
                        <div className="flex justify-between items-center">
                          <input
                            type="text"
                            value={it.name}
                            onChange={e => updateBatchItem(it.id, 'name', e.target.value)}
                            className="bg-white border rounded-lg px-2 py-1 text-xs font-bold flex-1 mr-2"
                          />
                          {batchItems.length > 1 && <button onClick={() => removeBatchItem(it.id)} className="text-gray-400">✕</button>}
                        </div>

                        <div className="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                          <div>
                            <span className="text-gray-400 block">Cant.</span>
                            <input
                              type="number"
                              value={it.quantity}
                              onChange={e => updateBatchItem(it.id, 'quantity', Number(e.target.value))}
                              className="w-full bg-white border rounded-lg py-1 text-center font-bold"
                            />
                          </div>
                          <div>
                            <span className="text-gray-400 block">Venta RD$</span>
                            <input
                              type="number"
                              value={it.sellingPrice}
                              onChange={e => updateBatchItem(it.id, 'sellingPrice', Number(e.target.value))}
                              className="w-full bg-white border rounded-lg py-1 text-center font-bold text-emerald-700"
                            />
                          </div>
                          <div>
                            <span className="text-gray-400 block">Empaque RD$</span>
                            <input
                              type="number"
                              value={it.packagingCost}
                              onChange={e => updateBatchItem(it.id, 'packagingCost', Number(e.target.value))}
                              className="w-full bg-white border rounded-lg py-1 text-center font-bold"
                            />
                          </div>
                        </div>

                        <div className="flex justify-between pt-1 border-t text-[11px]">
                          <span className="text-gray-400">Costo: <b>{formatRD(it.totalCostUnit)}</b></span>
                          <span className="text-emerald-700 font-bold">+{formatRD(it.profit)} ({it.margin}%)</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="bg-gradient-to-br from-brand-charcoal to-[#2B2B2B] p-4 rounded-2xl text-white space-y-1">
                    <div className="flex justify-between items-baseline">
                      <span className="text-xs text-white/60">Ganancia Consolidada:</span>
                      <span className="text-lg font-black text-emerald-400">+{formatRD(batchMetrics.totalProfit)} ({batchMetrics.totalMargin}%)</span>
                    </div>
                  </div>
                </div>
              )}

              {simMode === "single" && (
                <div className="bg-white p-4 rounded-2xl border border-gray-100 space-y-3 shadow-2xs">
                  <span className="text-xs font-bold text-gray-900 block">Postre Único</span>
                  <input
                    type="text"
                    placeholder="Nombre del postre"
                    value={singleName}
                    onChange={e => setSingleName(e.target.value)}
                    className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold outline-none"
                  />

                  <div className="grid grid-cols-3 gap-2">
                    <input
                      type="number"
                      placeholder="Ingredientes"
                      value={singleIngredients}
                      onChange={e => setSingleIngredients(e.target.value)}
                      className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-2 py-1.5 text-xs outline-none"
                    />
                    <input
                      type="number"
                      placeholder="Empaque"
                      value={singlePackaging}
                      onChange={e => setSinglePackaging(e.target.value)}
                      className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-2 py-1.5 text-xs outline-none"
                    />
                    <input
                      type="number"
                      placeholder="Gas / Mano de obra"
                      value={singleLaborGas}
                      onChange={e => setSingleLaborGas(e.target.value)}
                      className="w-full bg-[#FAF7F8] border border-gray-200 rounded-xl px-2 py-1.5 text-xs outline-none"
                    />
                  </div>

                  <div className="p-3 bg-[#FDECEF] rounded-xl space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span>Margen Deseado:</span>
                      <span className="text-[#D46B84]">{singleMargin}%</span>
                    </div>
                    <input
                      type="range"
                      min="40"
                      max="85"
                      value={singleMargin}
                      onChange={e => setSingleMargin(Number(e.target.value))}
                      className="w-full h-1.5 bg-gray-200 rounded-lg cursor-pointer"
                    />
                  </div>

                  {singleResults && (
                    <div className="flex justify-between items-baseline pt-2 border-t text-xs">
                      <div>
                        <span className="text-gray-400 block text-[10px]">Precio Sugerido:</span>
                        <span className="text-base font-black text-gray-900">{formatRD(singleResults.suggested)}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-gray-400 block text-[10px]">Ganancia:</span>
                        <span className="text-sm font-bold text-emerald-600">+{formatRD(singleResults.profit)}</span>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL DE AJUSTES (ABIERTO POR LA TUERCA ⚙️)               */}
          {/* ======================================================== */}
          {isAjustesOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-base font-extrabold text-gray-900">Configuración</h3>
                  <button onClick={() => setIsAjustesOpen(false)} className="text-gray-400 text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs text-gray-600">
                  <div className="p-3 bg-gray-50 rounded-2xl space-y-1">
                    <span className="font-bold text-gray-800 block">Estado del Sistema</span>
                    <p className="text-[11px] text-gray-500">Conectado a Firebase Firestore en tiempo real.</p>
                  </div>

                  <div className="p-3 bg-[#FAF7F8] rounded-2xl space-y-1">
                    <span className="font-bold text-gray-800 block">Datos Bancarios</span>
                    <p className="text-[11px] text-gray-500">Se copian automáticamente al tocar el botón en la cabecera.</p>
                  </div>
                </div>

                <button
                  onClick={() => setIsAjustesOpen(false)}
                  className="w-full bg-brand-charcoal text-white text-xs font-bold py-2.5 rounded-xl shadow-xs"
                >
                  Listo
                </button>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* BARRA INFERIOR FIJA APPLE (5 ACCESOS DIRECTOS)           */}
          {/* ======================================================== */}
          <nav id="bottom-tab-bar" className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-xl border-t border-gray-100 pb-[max(env(safe-area-inset-bottom),8px)] pt-2 shadow-[0_-4px_24px_rgba(0,0,0,0.03)]">
            <div className="max-w-md mx-auto grid grid-cols-5 text-center px-1">
              
              <button
                type="button"
                onClick={() => setTab("invoices")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'invoices' ? 'text-[#D46B84] font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <div className="relative">
                  <span className="text-lg">📋</span>
                  {pendingWebOrders.length > 0 && (
                    <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-black w-3.5 h-3.5 rounded-full flex items-center justify-center border-2 border-white">
                      {pendingWebOrders.length}
                    </span>
                  )}
                </div>
                <span className="text-[9.5px] leading-tight block mt-0.5">Facturas</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("customers")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'customers' ? 'text-[#D46B84] font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">👥</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Clientes</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("menu")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'menu' ? 'text-[#D46B84] font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">🧁</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Menú</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("finances")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'finances' ? 'text-[#D46B84] font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">📊</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Finanzas</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("simulator")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'simulator' ? 'text-[#D46B84] font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">🧮</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Simulador</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
