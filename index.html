<body class="bg-brand-softBg text-brand-charcoal min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    };

    const copyToClipboard = (text) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(textArea);
      return Promise.resolve();
    };

    // Compresor de fotos de alta fidelidad que preserva proporción y transparencia
    const compressImage = (file, maxWidth = 500, maxHeight = 500) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round(height * (maxWidth / width));
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round(width * (maxHeight / height));
                height = maxHeight;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);
            const outputType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            resolve(canvas.toDataURL(outputType, 0.88));
          };
        };
      });
    };

    const LeRossBadge = ({ size = 42 }) => (
      <div 
        style={{ width: size, height: size }}
        className="rounded-2xl bg-brand-pink flex flex-col items-center justify-center text-white shadow-sm flex-shrink-0 relative overflow-hidden p-1"
      >
        <svg viewBox="0 0 100 100" className="w-full h-full fill-current">
          <ellipse cx="50" cy="30" rx="20" ry="6" fill="none" stroke="white" strokeWidth="4" />
          <ellipse cx="50" cy="40" rx="24" ry="7" fill="none" stroke="white" strokeWidth="4" />
          <ellipse cx="50" cy="52" rx="28" ry="8" fill="none" stroke="white" strokeWidth="4" />
          <text x="50" y="74" textAnchor="middle" fill="white" fontFamily="serif" fontSize="19" fontWeight="bold">LeRoss</text>
          <text x="50" y="86" textAnchor="middle" fill="white" letterSpacing="2" fontSize="9" fontWeight="600">BAKERY</text>
        </svg>
      </div>
    );

    function App() {
      const [tab, setTab] = useState("invoices");
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [toastMsg, setToastMsg] = useState("");
      const [cloudStatus, setCloudStatus] = useState("connecting");
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const defaultState = {
        counter: 1,
        hasIssuedFirst: false,
        prefix: "FAC-",
        business: {
          name: "LeRoss Bakery",
          customLogo: "",
          phone: "849-441-1315",
          address: "Santo Domingo, D.N.",
          email: "contacto@lerossbakery.com",
          instagram: "@rossynellys",
          rnc: "",
          footerMsg: "¡Gracias por endulzar tus momentos con nosotros! 🧁",
          paymentInstructions: "Banco Popular / Banreservas / BHD\nCuenta de Ahorros: 000-000000-0\nA nombre de: LeRoss Bakery\nPor favor enviar comprobante a este WhatsApp."
        },
        taxSettings: { applyITBIS: false, defaultRate: 18 },
        products: [
          { id: "p1", name: "Flan Tradicional Casero", price: 1200, exempt: false },
          { id: "p2", name: "Caja Mini Brownies (12 uds)", price: 650, exempt: false },
          { id: "p3", name: "Tres Leches Clásico Familiar", price: 1500, exempt: false },
          { id: "p4", name: "Pudín Dominicano Decorado", price: 2400, exempt: false }
        ],
        invoices: [],
        drafts: []
      };

      const [state, setState] = useState(() => {
        const local = localStorage.getItem("leross_cloud_cache");
        return local ? JSON.parse(local) : defaultState;
      });

      useEffect(() => {
        if (!db) {
          setCloudStatus("local");
          return;
        }

        const unsubscribe = db.collection("leross_app").doc("main_data").onSnapshot(
          (doc) => {
            if (doc.exists) {
              const cloudData = doc.data();
              setState(cloudData);
              localStorage.setItem("leross_cloud_cache", JSON.stringify(cloudData));
              setCloudStatus("synced");
            } else {
              db.collection("leross_app").doc("main_data").set(defaultState);
              setCloudStatus("synced");
            }
          },
          (err) => {
            console.error("Firestore error:", err);
            setCloudStatus("error");
          }
        );

        return () => unsubscribe();
      }, []);

      const saveToCloud = (newState) => {
        setState(newState);
        localStorage.setItem("leross_cloud_cache", JSON.stringify(newState));
        if (db) {
          db.collection("leross_app").doc("main_data").set(newState).catch(err => {
            console.error("Cloud write failed:", err);
            showToast("Guardado solo local");
          });
        }
      };

      const [currentDraftId, setCurrentDraftId] = useState(null);
      const [draft, setDraft] = useState({
        customerName: "",
        customerPhone: "",
        date: new Date().toISOString().split("T")[0],
        deliveryDate: "",
        items: [{ id: 1, name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
        orderDiscountType: "amount",
        orderDiscountVal: 0,
        paymentStatus: "Pendiente",
        paymentMethod: "Transferencia",
        notes: ""
      });

      const calculation = useMemo(() => {
        let subtotal = 0;
        let taxableSubtotal = 0;

        const calculatedLines = draft.items.map(item => {
          const raw = Number(item.quantity || 0) * Number(item.unitPrice || 0);
          let disc = item.discountType === "percent"
            ? raw * (Number(item.discountVal || 0) / 100)
            : Number(item.discountVal || 0);
          disc = Math.min(raw, Math.max(0, disc));
          const lineTotal = raw - disc;
          subtotal += lineTotal;
          if (!item.exempt) taxableSubtotal += lineTotal;
          return { ...item, lineSubtotal: raw, lineDiscount: disc, lineTotal };
        });

        let orderDisc = draft.orderDiscountType === "percent"
          ? subtotal * (Number(draft.orderDiscountVal || 0) / 100)
          : Number(draft.orderDiscountVal || 0);
        orderDisc = Math.min(subtotal, Math.max(0, orderDisc));
        const discountedSubtotal = subtotal - orderDisc;

        const effectiveTaxableRatio = subtotal > 0 ? (taxableSubtotal / subtotal) : 0;
        const finalTaxableBase = discountedSubtotal * effectiveTaxableRatio;
        const itbis = state.taxSettings.applyITBIS ? (finalTaxableBase * (state.taxSettings.defaultRate / 100)) : 0;
        const total = discountedSubtotal + itbis;

        return { lines: calculatedLines, subtotal, orderDiscount: orderDisc, discountedSubtotal, itbis, total };
      }, [draft, state.taxSettings]);

      const resetDraft = () => {
        setCurrentDraftId(null);
        setDraft({
          customerName: "",
          customerPhone: "",
          date: new Date().toISOString().split("T")[0],
          deliveryDate: "",
          items: [{ id: Date.now(), name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
          orderDiscountType: "amount",
          orderDiscountVal: 0,
          paymentStatus: "Pendiente",
          paymentMethod: "Transferencia",
          notes: ""
        });
      };

      const saveDraftRecord = () => {
        if (!draft.customerName.trim()) {
          alert("Indique el nombre del cliente para guardar el borrador.");
          return;
        }
        const draftId = currentDraftId || ("draft_" + Date.now());
        const draftRecord = { ...draft, id: draftId, state: "Borrador", calculation, updatedAt: new Date().toISOString() };
        
        const filtered = (state.drafts || []).filter(d => d.id !== draftId);
        saveToCloud({ ...state, drafts: [draftRecord, ...filtered] });
        showToast("Borrador guardado");
      };

      const emitInvoice = () => {
        if (!draft.customerName.trim()) {
          alert("Indique el nombre del cliente");
          return;
        }
        if (calculation.total <= 0) {
          alert("El total debe ser mayor a RD$ 0");
          return;
        }

        const invoiceNumber = `${state.prefix}${String(state.counter).padStart(4, "0")}`;
        const newInvoice = {
          ...draft,
          id: "inv_" + Date.now(),
          number: invoiceNumber,
          state: "Emitida",
          calculation,
          createdAt: new Date().toISOString()
        };

        const filteredDrafts = (state.drafts || []).filter(d => d.id !== currentDraftId);
        saveToCloud({
          ...state,
          counter: state.counter + 1,
          hasIssuedFirst: true,
          invoices: [newInvoice, ...state.invoices],
          drafts: filteredDrafts
        });

        setSelectedInvoice(newInvoice);
        setTab("view");
        showToast(`Factura ${invoiceNumber} emitida`);
      };

      const voidInvoice = (invId) => {
        if (!confirm("¿Está seguro de anular esta factura?")) return;
        saveToCloud({
          ...state,
          invoices: state.invoices.map(inv => inv.id === invId ? { ...inv, state: "Anulada" } : inv)
        });
        if (selectedInvoice && selectedInvoice.id === invId) {
          setSelectedInvoice(prev => ({ ...prev, state: "Anulada" }));
        }
        showToast("Factura anulada");
      };

      const markAsPaid = (invId) => {
        saveToCloud({
          ...state,
          invoices: state.invoices.map(inv => inv.id === invId ? { ...inv, paymentStatus: "Pagada" } : inv)
        });
        if (selectedInvoice && selectedInvoice.id === invId) {
          setSelectedInvoice(prev => ({ ...prev, paymentStatus: "Pagada" }));
        }
        showToast("Marcada como Pagada");
      };

      const shareWhatsApp = (inv) => {
        const cleanPhone = (inv.customerPhone || "").replace(/\D/g, "");
        let targetPhone = "";
        if (cleanPhone.length === 10) targetPhone = "1" + cleanPhone;
        else if (cleanPhone.length === 11 && cleanPhone.startsWith("1")) targetPhone = cleanPhone;

        const itemsText = inv.calculation.lines.map(l => `• ${l.quantity}x ${l.name} — ${formatRD(l.lineTotal)}`).join("\n");
        const message = `🧁 *${state.business.name}*\n` +
          `Factura: *${inv.number}*\n` +
          `Fecha: ${formatDate(inv.date)}\n` +
          `Cliente: *${inv.customerName}*\n\n` +
          `📋 *Detalle del Pedido:*\n${itemsText}\n\n` +
          `*Total: ${formatRD(inv.calculation.total)}*\n` +
          `*Estado:* ${inv.paymentStatus === 'Pagada' ? '✅ Pagada' : '⏳ Pendiente'}\n` +
          (inv.paymentStatus === 'Pendiente' ? `\n💳 *Datos de Pago:*\n${state.business.paymentInstructions}\n` : '') +
          `\n${state.business.footerMsg}`;

        const url = targetPhone 
          ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`
          : `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      };

      const handlePrintOrPdf = async (inv) => {
        const element = document.getElementById("print-area");
        if (!element) return;

        setIsGeneratingPdf(true);
        showToast("Preparando PDF...");

        const opt = {
          margin: [8, 8, 8, 8],
          filename: `${inv.number || 'Factura'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2.5, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
        };

        try {
          if (window.html2pdf) {
            const worker = window.html2pdf().set(opt).from(element);
            const pdfBlob = await worker.outputPdf('blob');
            const pdfFile = new File([pdfBlob], `${inv.number}.pdf`, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
              await navigator.share({
                files: [pdfFile],
                title: `${inv.number} - LeRoss Bakery`,
                text: `Factura ${inv.number}`
              });
              showToast("PDF listo");
            } else {
              await window.html2pdf().set(opt).from(element).save();
              showToast("PDF descargado");
            }
          } else {
            window.print();
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error("PDF error:", err);
            window.print();
          }
        } finally {
          setIsGeneratingPdf(false);
        }
      };

      const handleLogoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const compressed = await compressImage(file);
        saveToCloud({ ...state, business: { ...state.business, customLogo: compressed } });
        showToast("Logo optimizado y guardado");
      };

      const removeLogo = () => {
        if (!confirm("¿Deseas restablecer el logo al diseño predeterminado?")) return;
        saveToCloud({ ...state, business: { ...state.business, customLogo: "" } });
        showToast("Logo restablecido");
      };

      const metrics = useMemo(() => {
        const active = state.invoices.filter(i => i.state !== "Anulada");
        const totalMonth = active.reduce((acc, i) => acc + i.calculation.total, 0);
        const pending = active.filter(i => i.paymentStatus === "Pendiente").reduce((acc, i) => acc + i.calculation.total, 0);
        return { totalMonth, pending };
      }, [state.invoices]);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-xl relative pb-20">
          
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-brand-charcoal text-white text-xs px-4 py-2 rounded-full shadow-lg">
              {toastMsg}
            </div>
          )}

          {/* Encabezado App */}
          <header className="no-print bg-white/95 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between sticky top-0 z-20">
            <div className="flex items-center space-x-2.5">
              {state.business.customLogo ? (
                <img src={state.business.customLogo} alt="Logo" className="max-h-10 max-w-[50px] w-auto h-auto object-contain rounded-lg border border-brand-border p-0.5" />
              ) : (
                <LeRossBadge size={38} />
              )}
              <div>
                <span className="font-bold text-sm tracking-tight block text-brand-charcoal">{state.business.name}</span>
                <div className="flex items-center space-x-1.5">
                  <span className={`w-2 h-2 rounded-full ${cloudStatus === 'synced' ? 'bg-emerald-500' : cloudStatus === 'connecting' ? 'bg-amber-400 animate-pulse' : 'bg-rose-500'}`}></span>
                  <span className="text-[10px] text-gray-500 font-semibold">
                    {cloudStatus === 'synced' ? 'Nube Activa' : cloudStatus === 'connecting' ? 'Conectando...' : 'Error de Conexión'}
                  </span>
                </div>
              </div>
            </div>
            {tab === "view" ? (
              <button onClick={() => setTab("invoices")} className="text-xs bg-brand-softBg px-3 py-1.5 rounded-full font-semibold text-brand-darkPink">
                ← Volver
              </button>
            ) : (
              <button onClick={() => copyToClipboard(state.business.paymentInstructions).then(() => showToast("Datos bancarios copiados"))} className="text-[11px] bg-brand-softPink text-brand-darkPink px-2.5 py-1.5 rounded-full font-bold border border-brand-pink/30">
                💳 Copiar Banco
              </button>
            )}
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 p-4 overflow-y-auto">
            
            {/* VISTA 1: HISTORIAL DE FACTURAS */}
            {tab === "invoices" && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border">
                    <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Facturado</span>
                    <span className="text-lg font-bold text-brand-charcoal">{formatRD(metrics.totalMonth)}</span>
                  </div>
                  <div className="bg-brand-softPink p-3.5 rounded-2xl border border-rose-200">
                    <span className="text-[10px] font-bold text-rose-500 uppercase tracking-wider block">Por Cobrar</span>
                    <span className="text-lg font-bold text-rose-600">{formatRD(metrics.pending)}</span>
                  </div>
                </div>

                <div className="flex space-x-2">
                  <input
                    type="text"
                    placeholder="Buscar cliente o número..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="flex-1 text-xs bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 outline-none focus:border-brand-pink"
                  />
                  <select
                    value={statusFilter}
                    onChange={e => setStatusFilter(e.target.value)}
                    className="text-xs bg-brand-softBg border border-brand-border rounded-xl px-2.5 outline-none font-semibold text-brand-charcoal"
                  >
                    <option value="all">Todas</option>
                    <option value="Pendiente">Pendientes</option>
                    <option value="Pagada">Pagadas</option>
                    <option value="Anulada">Anuladas</option>
                  </select>
                </div>

                {/* Borradores */}
                {(state.drafts && state.drafts.length > 0) && (
                  <div className="space-y-2">
                    <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Borradores en Espera</span>
                    {state.drafts.map(d => (
                      <div
                        key={d.id}
                        onClick={() => {
                          setCurrentDraftId(d.id);
                          setDraft(d);
                          setTab("new");
                        }}
                        className="p-3 bg-amber-50/70 border border-amber-200 rounded-xl flex justify-between items-center cursor-pointer"
                      >
                        <div>
                          <p className="text-xs font-bold text-amber-900">{d.customerName || "Sin cliente"}</p>
                          <p className="text-[10px] text-amber-700">{formatDate(d.date)} • {formatRD(d.calculation.total)}</p>
                        </div>
                        <span className="text-[10px] font-bold bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">Editar</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Lista de Facturas */}
                <div className="space-y-2.5">
                  {state.invoices
                    .filter(inv => {
                      const matchesSearch = inv.customerName.toLowerCase().includes(searchQuery.toLowerCase()) || inv.number.toLowerCase().includes(searchQuery.toLowerCase());
                      const matchesStatus = statusFilter === "all" ? true : (statusFilter === "Anulada" ? inv.state === "Anulada" : inv.paymentStatus === statusFilter && inv.state !== "Anulada");
                      return matchesSearch && matchesStatus;
                    })
                    .map(inv => (
                      <div
                        key={inv.id}
                        onClick={() => { setSelectedInvoice(inv); setTab("view"); }}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer bg-white ${inv.state === 'Anulada' ? 'border-gray-200 opacity-60' : 'border-brand-border hover:border-brand-pink/50 shadow-sm'}`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <span className="font-bold text-sm text-brand-charcoal">{inv.number}</span>
                          <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase ${
                            inv.state === 'Anulada' ? 'bg-gray-100 text-gray-500' :
                            inv.paymentStatus === 'Pagada' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'
                          }`}>
                            {inv.state === 'Anulada' ? 'Anulada' : inv.paymentStatus}
                          </span>
                        </div>
                        <div className="flex justify-between items-baseline mt-2">
                          <div>
                            <p className="text-sm font-semibold text-brand-charcoal">{inv.customerName}</p>
                            <p className="text-[11px] text-gray-400">{formatDate(inv.date)}</p>
                          </div>
                          <span className="text-base font-bold text-brand-darkPink">{formatRD(inv.calculation.total)}</span>
                        </div>
                      </div>
                    ))}

                  {state.invoices.length === 0 && (!state.drafts || state.drafts.length === 0) && (
                    <div className="text-center py-12 text-gray-400 text-xs">
                      No hay facturas emitidas todavía.<br/>Pulsa <b>+ Nueva</b> para crear una orden.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VISTA 2: NUEVA FACTURA */}
            {tab === "new" && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-bold text-brand-charcoal">
                    {currentDraftId ? "Modificar Borrador" : "Nueva Factura"}
                  </h2>
                  <button onClick={resetDraft} className="text-xs text-gray-400 hover:text-brand-darkPink">Limpiar</button>
                </div>
                
                <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Cliente</label>
                    <input
                      type="text"
                      placeholder="Nombre completo"
                      value={draft.customerName}
                      onChange={e => setDraft({ ...draft, customerName: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-pink"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold text-gray-500 block mb-1">WhatsApp</label>
                      <input
                        type="tel"
                        placeholder="849-000-0000"
                        value={draft.customerPhone}
                        onChange={e => setDraft({ ...draft, customerPhone: e.target.value })}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-500 block mb-1">Fecha</label>
                      <input
                        type="date"
                        value={draft.date}
                        onChange={e => setDraft({ ...draft, date: e.target.value })}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 text-sm outline-none"
                      />
                    </div>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-brand-charcoal uppercase tracking-wider">Postres</label>
                    <button
                      type="button"
                      onClick={() => setDraft({
                        ...draft,
                        items: [...draft.items, { id: Date.now(), name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }]
                      })}
                      className="text-xs text-brand-darkPink font-bold hover:underline"
                    >
                      + Añadir Postre
                    </button>
                  </div>

                  {draft.items.map((item, idx) => (
                    <div key={item.id} className="p-3 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                      <div className="flex space-x-2">
                        <select
                          className="flex-1 bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs outline-none font-medium"
                          onChange={(e) => {
                            const prod = state.products.find(p => p.id === e.target.value);
                            if (prod) {
                              const updated = [...draft.items];
                              updated[idx].name = prod.name;
                              updated[idx].unitPrice = prod.price;
                              updated[idx].exempt = prod.exempt;
                              setDraft({ ...draft, items: updated });
                            }
                          }}
                        >
                          <option value="">Elegir del menú...</option>
                          {state.products.map(p => (
                            <option key={p.id} value={p.id}>{p.name} ({formatRD(p.price)})</option>
                          ))}
                        </select>
                        <button
                          onClick={() => {
                            if (draft.items.length > 1) {
                              setDraft({ ...draft, items: draft.items.filter((_, i) => i !== idx) });
                            }
                          }}
                          className="text-gray-400 hover:text-rose-500 text-xs px-2"
                        >
                          ✕
                        </button>
                      </div>

                      <input
                        type="text"
                        placeholder="Descripción o detalle"
                        value={item.name}
                        onChange={e => {
                          const updated = [...draft.items];
                          updated[idx].name = e.target.value;
                          setDraft({ ...draft, items: updated });
                        }}
                        className="w-full bg-white border border-brand-border rounded-xl px-3 py-1.5 text-xs outline-none"
                      />

                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <span className="text-[10px] text-gray-400 block font-semibold">Cant.</span>
                          <input
                            type="number"
                            min="1"
                            value={item.quantity}
                            onChange={e => {
                              const updated = [...draft.items];
                              updated[idx].quantity = Number(e.target.value);
                              setDraft({ ...draft, items: updated });
                            }}
                            className="w-full bg-white border border-brand-border rounded-xl px-2 py-1 text-xs text-center outline-none font-semibold"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-gray-400 block font-semibold">Precio RD$</span>
                          <input
                            type="number"
                            value={item.unitPrice}
                            onChange={e => {
                              const updated = [...draft.items];
                              updated[idx].unitPrice = Number(e.target.value);
                              setDraft({ ...draft, items: updated });
                            }}
                            className="w-full bg-white border border-brand-border rounded-xl px-2 py-1 text-xs text-center outline-none font-semibold"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-gray-400 block font-semibold">Total</span>
                          <div className="text-xs font-bold py-1.5 text-right text-brand-darkPink">
                            {formatRD((item.quantity || 0) * (item.unitPrice || 0))}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-brand-softBg p-3.5 rounded-2xl border border-brand-border grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Estado de Pago</label>
                    <select
                      value={draft.paymentStatus}
                      onChange={e => setDraft({ ...draft, paymentStatus: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs font-semibold outline-none"
                    >
                      <option value="Pendiente">⏳ Pendiente</option>
                      <option value="Pagada">✅ Pagada</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-500 block mb-1">Forma de Pago</label>
                    <select
                      value={draft.paymentMethod}
                      onChange={e => setDraft({ ...draft, paymentMethod: e.target.value })}
                      className="w-full bg-white border border-brand-border rounded-xl px-2.5 py-1.5 text-xs font-semibold outline-none"
                    >
                      <option value="Transferencia">Transferencia</option>
                      <option value="Efectivo">Efectivo</option>
                      <option value="Tarjeta">Tarjeta</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                </div>

                <div className="p-4 bg-brand-softBg rounded-2xl border border-brand-border space-y-1.5">
                  <div className="flex justify-between text-xs text-gray-500">
                    <span>Subtotal</span>
                    <span>{formatRD(calculation.subtotal)}</span>
                  </div>
                  {state.taxSettings.applyITBIS && (
                    <div className="flex justify-between text-xs text-gray-500">
                      <span>ITBIS ({state.taxSettings.defaultRate}%)</span>
                      <span>{formatRD(calculation.itbis)}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-base font-bold text-brand-charcoal pt-2 border-t border-brand-border">
                    <span>Total Final</span>
                    <span className="text-brand-darkPink">{formatRD(calculation.total)}</span>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={saveDraftRecord}
                    className="bg-brand-softPink hover:bg-rose-100 text-brand-darkPink font-bold py-3.5 rounded-2xl border border-brand-pink/30 text-xs transition-all"
                  >
                    Guardar Borrador
                  </button>
                  <button
                    type="button"
                    onClick={emitInvoice}
                    className="bg-brand-pink hover:bg-brand-darkPink text-white font-bold py-3.5 rounded-2xl shadow-md text-xs transition-all active:scale-[0.99]"
                  >
                    Emitir Factura Oficial
                  </button>
                </div>
              </div>
            )}

            {/* VISTA 3: FACTURA EMITIDA */}
            {tab === "view" && selectedInvoice && (
              <div className="space-y-4">
                <div className="no-print flex space-x-2">
                  <button
                    onClick={() => handlePrintOrPdf(selectedInvoice)}
                    disabled={isGeneratingPdf}
                    className="flex-1 bg-brand-charcoal text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1.5 shadow-sm active:scale-95 transition-all disabled:opacity-50"
                  >
                    <span>{isGeneratingPdf ? "⏳ Generando..." : "🖨 Imprimir / PDF"}</span>
                  </button>
                  <button
                    onClick={() => shareWhatsApp(selectedInvoice)}
                    className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-1 shadow-sm active:scale-95 transition-all"
                  >
                    <span>💬 WhatsApp</span>
                  </button>
                </div>

                {/* Documento de Factura con Logo Proporcional */}
                <div id="print-area" className="bg-white p-6 rounded-2xl border border-brand-border shadow-sm space-y-5 text-brand-charcoal">
                  <div className="flex justify-between items-start border-b border-brand-border pb-4">
                    <div className="flex items-center space-x-3.5">
                      {state.business.customLogo ? (
                        <div className="max-h-20 max-w-[130px] flex items-center justify-center">
                          <img 
                            src={state.business.customLogo} 
                            alt="Logo" 
                            className="max-h-20 max-w-[130px] w-auto h-auto object-contain rounded-xl" 
                          />
                        </div>
                      ) : (
                        <LeRossBadge size={54} />
                      )}
                      <div>
                        <h1 className="font-serif text-xl font-bold text-brand-darkPink leading-tight">{state.business.name}</h1>
                        <p className="text-xs text-gray-500">{state.business.address}</p>
                        <p className="text-xs text-gray-500">{state.business.phone}</p>
                        {state.business.instagram && <p className="text-xs text-brand-darkPink font-medium">{state.business.instagram}</p>}
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 block">Factura</span>
                      <span className="text-base font-bold text-brand-charcoal">{selectedInvoice.number}</span>
                      <p className="text-xs text-gray-400">{formatDate(selectedInvoice.date)}</p>
                    </div>
                  </div>

                  <div className="bg-brand-softBg p-3 rounded-xl text-xs space-y-0.5">
                    <span className="text-gray-400 uppercase tracking-wider text-[10px] block font-bold">Cliente</span>
                    <p className="font-bold text-sm text-brand-charcoal">{selectedInvoice.customerName}</p>
                    {selectedInvoice.customerPhone && <p className="text-gray-500">{selectedInvoice.customerPhone}</p>}
                  </div>

                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-brand-border text-gray-400 text-[10px] uppercase font-bold text-left">
                        <th className="py-1">Descripción</th>
                        <th className="py-1 text-center">Cant.</th>
                        <th className="py-1 text-right">Precio</th>
                        <th className="py-1 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-brand-softBg">
                      {selectedInvoice.calculation.lines.map((l, i) => (
                        <tr key={i}>
                          <td className="py-2.5 font-medium">{l.name}</td>
                          <td className="py-2.5 text-center text-gray-500">{l.quantity}</td>
                          <td className="py-2.5 text-right text-gray-500">{formatRD(l.unitPrice)}</td>
                          <td className="py-2.5 text-right font-bold text-brand-charcoal">{formatRD(l.lineTotal)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t border-brand-border pt-3 space-y-1 text-xs">
                    <div className="flex justify-between text-gray-500">
                      <span>Subtotal</span>
                      <span>{formatRD(selectedInvoice.calculation.subtotal)}</span>
                    </div>
                    {state.taxSettings.applyITBIS && (
                      <div className="flex justify-between text-gray-500">
                        <span>ITBIS</span>
                        <span>{formatRD(selectedInvoice.calculation.itbis)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-lg font-bold text-brand-darkPink pt-1">
                      <span>Total</span>
                      <span>{formatRD(selectedInvoice.calculation.total)}</span>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-brand-border text-xs space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-gray-400">Estado:</span>
                      <span className="font-bold">{selectedInvoice.paymentStatus} ({selectedInvoice.paymentMethod})</span>
                    </div>
                    {selectedInvoice.paymentStatus === 'Pendiente' && state.business.paymentInstructions && (
                      <div className="p-2.5 bg-brand-softBg rounded-xl text-[11px] whitespace-pre-line text-gray-600 border border-brand-border/60">
                        {state.business.paymentInstructions}
                      </div>
                    )}
                    <p className="text-center text-gray-400 text-[11px] italic pt-2">{state.business.footerMsg}</p>
                  </div>

                  {selectedInvoice.state === "Anulada" && (
                    <div className="p-2 text-center bg-rose-50 text-rose-600 font-bold rounded-xl text-xs uppercase tracking-wider border border-rose-200">
                      Factura Anulada
                    </div>
                  )}
                </div>

                <div className="no-print flex space-x-2 pt-2">
                  {selectedInvoice.state !== "Anulada" && (
                    <>
                      {selectedInvoice.paymentStatus === "Pendiente" && (
                        <button
                          onClick={() => markAsPaid(selectedInvoice.id)}
                          className="flex-1 bg-emerald-50 text-emerald-600 py-2.5 rounded-xl text-xs font-bold border border-emerald-200"
                        >
                          Marcar como Pagada
                        </button>
                      )}
                      <button
                        onClick={() => voidInvoice(selectedInvoice.id)}
                        className="text-xs text-rose-500 py-2.5 px-4 rounded-xl border border-rose-200 hover:bg-rose-50 font-bold"
                      >
                        Anular
                      </button>
                    </>
                  )}
                </div>
              </div>
            )}

            {/* VISTA 4: MENÚ DE POSTRES */}
            {tab === "products" && (
              <div className="space-y-4">
                <h2 className="text-base font-bold text-brand-charcoal">Menú de Postres</h2>
                <div className="space-y-2">
                  {state.products.map(p => (
                    <div key={p.id} className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border flex justify-between items-center">
                      <div>
                        <span className="font-bold text-sm block text-brand-charcoal">{p.name}</span>
                        <span className="text-xs font-bold text-brand-darkPink">{formatRD(p.price)}</span>
                      </div>
                      <button
                        onClick={() => saveToCloud({ ...state, products: state.products.filter(item => item.id !== p.id) })}
                        className="text-gray-400 hover:text-rose-500 text-xs px-2"
                      >
                        Eliminar
                      </button>
                    </div>
                  ))}
                </div>
                
                <div className="p-3.5 bg-white border border-brand-border rounded-2xl space-y-2">
                  <span className="text-xs font-bold text-brand-charcoal block">Añadir Postre al Menú</span>
                  <input id="new-prod-name" placeholder="Ej. Tarta de Chocolate y Frambuesa" className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none" />
                  <input id="new-prod-price" type="number" placeholder="Precio (RD$)" className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none" />
                  <button
                    onClick={() => {
                      const name = document.getElementById("new-prod-name").value;
                      const price = Number(document.getElementById("new-prod-price").value);
                      if (name && price) {
                        saveToCloud({
                          ...state,
                          products: [...state.products, { id: "p_" + Date.now(), name, price, exempt: false }]
                        });
                        document.getElementById("new-prod-name").value = "";
                        document.getElementById("new-prod-price").value = "";
                        showToast("Postre añadido y sincronizado");
                      }
                    }}
                    className="w-full bg-brand-pink text-white text-xs font-bold py-2.5 rounded-xl shadow-sm"
                  >
                    Guardar en el Menú
                  </button>
                </div>
              </div>
            )}

            {/* VISTA 5: AJUSTES Y NEGOCIO */}
            {tab === "settings" && (
              <div className="space-y-4 text-xs">
                <h2 className="text-base font-bold text-brand-charcoal">Identidad de Marca & Ajustes</h2>
                
                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-3">
                  <span className="font-bold text-brand-charcoal block">Logo de la Pastelería</span>
                  <div className="flex items-center space-x-3">
                    {state.business.customLogo ? (
                      <div className="w-16 h-16 bg-white rounded-xl border border-brand-pink/40 flex items-center justify-center p-1 shadow-sm">
                        <img src={state.business.customLogo} alt="Logo" className="max-w-full max-h-full object-contain" />
                      </div>
                    ) : (
                      <LeRossBadge size={64} />
                    )}
                    <div className="flex-1 space-y-1.5">
                      <label className="bg-white border border-brand-pink/50 text-brand-darkPink font-bold px-3 py-2 rounded-xl text-xs block text-center cursor-pointer shadow-sm active:scale-95 transition-all">
                        <span>📷 Cambiar Logo desde Fotos</span>
                        <input type="file" accept="image/*" onChange={handleLogoUpload} className="hidden" />
                      </label>
                      {state.business.customLogo && (
                        <button
                          onClick={removeLogo}
                          className="w-full text-[11px] text-gray-400 hover:text-rose-500 font-semibold text-center block py-1"
                        >
                          Restablecer logo original
                        </button>
                      )}
                      <span className="text-[10px] text-gray-400 block text-center">Se adapta automáticamente sin recortar bordes ni textos.</span>
                    </div>
                  </div>
                </div>

                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                  <label className="font-bold text-gray-500 block">Nombre del Negocio</label>
                  <input
                    value={state.business.name}
                    onChange={e => saveToCloud({ ...state, business: { ...state.business, name: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none font-semibold"
                  />
                  <label className="font-bold text-gray-500 block">Teléfono / WhatsApp</label>
                  <input
                    value={state.business.phone}
                    onChange={e => saveToCloud({ ...state, business: { ...state.business, phone: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none font-semibold"
                  />
                  <label className="font-bold text-gray-500 block">Instagram</label>
                  <input
                    value={state.business.instagram}
                    onChange={e => saveToCloud({ ...state, business: { ...state.business, instagram: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none font-semibold"
                  />
                  <label className="font-bold text-gray-500 block">Datos Bancarios para Transferencias</label>
                  <textarea
                    rows="3"
                    value={state.business.paymentInstructions}
                    onChange={e => saveToCloud({ ...state, business: { ...state.business, paymentInstructions: e.target.value } })}
                    className="w-full bg-white border border-brand-border rounded-xl px-3 py-2 outline-none text-xs"
                  />
                </div>

                <div className="p-3.5 bg-brand-softBg rounded-2xl border border-brand-border space-y-2">
                  <span className="font-bold text-gray-500 block">Numeración Secuencial</span>
                  <div className="flex space-x-2">
                    <input
                      disabled={state.hasIssuedFirst}
                      value={state.prefix}
                      onChange={e => saveToCloud({ ...state, prefix: e.target.value })}
                      placeholder="FAC-"
                      className="w-1/2 bg-white border border-brand-border rounded-xl px-3 py-2 outline-none disabled:bg-gray-100 font-semibold"
                    />
                    <input
                      type="number"
                      disabled={state.hasIssuedFirst}
                      value={state.counter}
                      onChange={e => saveToCloud({ ...state, counter: Number(e.target.value) })}
                      className="w-1/2 bg-white border border-brand-border rounded-xl px-3 py-2 outline-none disabled:bg-gray-100 font-semibold"
                    />
                  </div>
                  {state.hasIssuedFirst && (
                    <span className="text-[10px] text-gray-400 block">Numeración activa en la nube para garantizar orden consecutivo entre dispositivos.</span>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Barra de Pestañas Inferior */}
          <nav className="no-print bg-white/95 backdrop-blur-md border-t border-brand-border flex justify-around py-3 absolute bottom-0 left-0 right-0 z-30">
            <button
              onClick={() => setTab("invoices")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'invoices' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">📋</span>
              Facturas
            </button>
            <button
              onClick={() => {
                resetDraft();
                setTab("new");
              }}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'new' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">➕</span>
              Nueva
            </button>
            <button
              onClick={() => setTab("products")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'products' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">🧁</span>
              Menú
            </button>
            <button
              onClick={() => setTab("settings")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'settings' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">⚙️</span>
              Ajustes
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
