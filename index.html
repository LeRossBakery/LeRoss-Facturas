<body class="selection:bg-brand-pink/20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const WHATSAPP_PHONE = "18494411315";
    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatWholeRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    };

    const playOrderChime = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    };

    // Función pura para determinar el siguiente correlativo FAC-XXXX
    const calculateNextInvoiceId = (invoices) => {
      const maxNum = (invoices || []).reduce((max, inv) => {
        const match = (inv.id || "").match(/FAC-(\d+)/);
        const num = match ? parseInt(match[1], 10) : 0;
        return Math.max(max, num);
      }, 0);
      return "FAC-" + String(maxNum + 1).padStart(4, "0");
    };

    function App() {
      const [tab, setTab] = useState("invoices"); // webOrders, invoices, menu, finances, simulator
      const [cloudStatus, setCloudStatus] = useState("connecting");
      const [toastMsg, setToastMsg] = useState("");

      const [data, setData] = useState({
        invoices: [],
        products: [],
        customers: [],
        expenses: [],
        simulations: [],
        webOrders: []
      });

      const prevOrdersCount = useRef(0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      useEffect(() => {
        if (!db) {
          setCloudStatus("offline");
          return;
        }

        const unsubscribe = db.collection("leross_app").doc("main_data").onSnapshot(
          (doc) => {
            if (doc.exists) {
              const res = doc.data();
              const orders = res.webOrders || [];
              const pendingCount = orders.filter(o => o.status === "Pendiente").length;

              if (prevOrdersCount.current !== 0 && pendingCount > prevOrdersCount.current) {
                playOrderChime();
                showToast("🔔 ¡Nuevo pedido web entrante!");
              }
              prevOrdersCount.current = pendingCount;

              setData({
                invoices: res.invoices || [],
                products: res.products || [],
                customers: res.customers || [],
                expenses: res.expenses || [],
                simulations: res.simulations || [],
                webOrders: orders
              });
              setCloudStatus("synced");
            } else {
              setCloudStatus("empty");
            }
          },
          (err) => {
            console.error("Firestore sync error:", err);
            setCloudStatus("error");
          }
        );

        return () => unsubscribe();
      }, []);

      // Próximo número de factura oficial proyectado
      const nextDefiniteInvoiceId = useMemo(() => {
        return calculateNextInvoiceId(data.invoices);
      }, [data.invoices]);

      // =============================================================
      // 1. PEDIDOS WEB (FLUJO TEMPORAL -> DEFINITIVO)
      // =============================================================
      const pendingWebOrders = useMemo(() => {
        return (data.webOrders || []).filter(o => o.status === "Pendiente");
      }, [data.webOrders]);

      // CONFIRMACIÓN DIRECTA EN 1 TOQUE
      const handleConfirmWebOrder = async (order) => {
        const definiteId = calculateNextInvoiceId(data.invoices);

        const subtotal = Number(order.subtotal || 0);
        const newInvoice = {
          id: definiteId,
          sourceOrderId: order.id, // Referencia al código temporal ORD-XXXX
          date: new Date().toISOString().split("T")[0],
          customer: {
            name: order.customerName || "Cliente Web",
            phone: order.customerPhone || "",
            rnc: "",
            address: order.deliveryAddress || ""
          },
          deliveryDate: order.deliveryDate || "",
          deliveryTime: order.deliveryTime || "",
          deliveryType: order.deliveryType || "Pickup",
          items: (order.items || []).map(it => ({
            name: it.name,
            quantity: Number(it.quantity || 1),
            price: Number(it.price || 0),
            total: Number(it.total || (it.price * it.quantity))
          })),
          shippingFee: 0,
          calculation: { subtotal, total: subtotal },
          paymentStatus: "Pendiente",
          state: "Válida",
          notes: order.specialNotes || "",
          createdAt: new Date().toISOString()
        };

        // Actualizar el estado del pedido web a Confirmada con el enlace a su factura definitiva
        const updatedOrders = (data.webOrders || []).map(o => {
          if (o.id === order.id) {
            return {
              ...o,
              status: "Confirmada",
              assignedInvoiceId: definiteId,
              confirmedAt: new Date().toISOString()
            };
          }
          return o;
        });

        // Actualizar directorio de clientes
        const customerList = [...(data.customers || [])];
        const existingIdx = customerList.findIndex(c => c.name.toLowerCase() === newInvoice.customer.name.toLowerCase());
        if (existingIdx >= 0) {
          customerList[existingIdx] = { ...customerList[existingIdx], ...newInvoice.customer };
        } else {
          customerList.push({ id: "cust_" + Date.now(), ...newInvoice.customer });
        }

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              invoices: [newInvoice, ...(data.invoices || [])],
              webOrders: updatedOrders,
              customers: customerList
            });

            showToast(`✓ ${order.id} confirmado bajo Factura ${definiteId}`);
            setViewingInvoice(newInvoice); // Abre el recibo directamente listo para WhatsApp o imprimir
          }
        } catch (err) {
          console.error("Error confirmando pedido web:", err);
          showToast("Error de conexión");
        }
      };

      const handleRejectWebOrder = async (orderId) => {
        if (!confirm("¿Deseas rechazar este pedido web?")) return;
        const updated = (data.webOrders || []).map(o => {
          if (o.id === orderId) return { ...o, status: "Rechazada" };
          return o;
        });

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ webOrders: updated });
            showToast("Pedido rechazado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      // =============================================================
      // 2. FACTURAS MANUALES Y RECIBOS
      // =============================================================
      const [isCreatingInvoice, setIsCreatingInvoice] = useState(false);
      const [viewingInvoice, setViewingInvoice] = useState(null);
      const [invFilter, setInvFilter] = useState("all");

      const [invCustomerName, setInvCustomerName] = useState("");
      const [invCustomerPhone, setInvCustomerPhone] = useState("");
      const [invCustomerRnc, setInvCustomerRnc] = useState("");
      const [invDeliveryAddress, setInvDeliveryAddress] = useState("");
      const [invDeliveryDate, setInvDeliveryDate] = useState("");
      const [invPaymentStatus, setInvPaymentStatus] = useState("Pagada");
      const [invNotes, setInvNotes] = useState("");
      const [invShippingFee, setInvShippingFee] = useState(0);
      const [invItems, setInvItems] = useState([{ id: 1, name: "", quantity: 1, price: 0, total: 0 }]);

      const handleSelectExistingCustomer = (cName) => {
        setInvCustomerName(cName);
        const found = (data.customers || []).find(c => c.name.toLowerCase() === cName.toLowerCase());
        if (found) {
          if (found.phone) setInvCustomerPhone(found.phone);
          if (found.rnc) setInvCustomerRnc(found.rnc);
          if (found.address) setInvDeliveryAddress(found.address);
        }
      };

      const addInvoiceLine = () => {
        setInvItems(prev => [...prev, { id: Date.now(), name: "", quantity: 1, price: 0, total: 0 }]);
      };

      const updateInvoiceLine = (id, field, val) => {
        setInvItems(prev => prev.map(line => {
          if (line.id === id) {
            const updated = { ...line, [field]: val };
            if (field === 'name') {
              const p = (data.products || []).find(prod => prod.name.toLowerCase() === String(val).toLowerCase());
              if (p) {
                updated.price = p.price;
                updated.total = Number(updated.quantity || 1) * p.price;
              }
            }
            if (field === 'price' || field === 'quantity') {
              updated.total = Number(updated.quantity || 0) * Number(updated.price || 0);
            }
            return updated;
          }
          return line;
        }));
      };

      const removeInvoiceLine = (id) => {
        if (invItems.length <= 1) return;
        setInvItems(prev => prev.filter(i => i.id !== id));
      };

      const handleSaveManualInvoice = async (e) => {
        e.preventDefault();
        if (!invCustomerName.trim()) return alert("Indica el nombre del cliente.");

        const definiteId = calculateNextInvoiceId(data.invoices);
        const subtotal = invItems.reduce((acc, it) => acc + (Number(it.total) || 0), 0);
        const total = subtotal + Number(invShippingFee || 0);

        const newInv = {
          id: definiteId,
          date: new Date().toISOString().split("T")[0],
          customer: {
            name: invCustomerName.trim(),
            phone: invCustomerPhone.trim(),
            rnc: invCustomerRnc.trim(),
            address: invDeliveryAddress.trim()
          },
          deliveryDate: invDeliveryDate,
          items: invItems.filter(it => it.name.trim() !== ""),
          shippingFee: Number(invShippingFee || 0),
          calculation: { subtotal, total },
          paymentStatus: invPaymentStatus,
          state: "Válida",
          notes: invNotes.trim(),
          createdAt: new Date().toISOString()
        };

        const customerList = [...(data.customers || [])];
        const existingIdx = customerList.findIndex(c => c.name.toLowerCase() === newInv.customer.name.toLowerCase());
        if (existingIdx >= 0) {
          customerList[existingIdx] = { ...customerList[existingIdx], ...newInv.customer };
        } else {
          customerList.push({ id: "cust_" + Date.now(), ...newInv.customer });
        }

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              invoices: [newInv, ...(data.invoices || [])],
              customers: customerList
            });
            setIsCreatingInvoice(false);
            showToast(`Factura ${newInv.id} creada`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleTogglePaymentStatus = async (invId, currentStatus) => {
        const nextStatus = currentStatus === "Pagada" ? "Pendiente" : "Pagada";
        const updated = (data.invoices || []).map(i => i.id === invId ? { ...i, paymentStatus: nextStatus } : i);
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ invoices: updated });
            showToast(`Estado: ${nextStatus}`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleAnularInvoice = async (invId) => {
        if (!confirm("¿Deseas anular esta factura?")) return;
        const updated = (data.invoices || []).map(i => i.id === invId ? { ...i, state: "Anulada" } : i);
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ invoices: updated });
            setViewingInvoice(null);
            showToast("Factura anulada");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleSendInvoiceWhatsApp = (inv) => {
        let msg = `*LeRoss Bakery — Factura Oficial ${inv.id}* 🧁\n\n`;
        if (inv.sourceOrderId) {
          msg += `📋 *Referencia Pedido:* ${inv.sourceOrderId}\n`;
        }
        msg += `👤 *Cliente:* ${inv.customer?.name}\n`;
        msg += `📅 *Fecha:* ${formatDate(inv.date)}\n`;
        if (inv.deliveryDate) msg += `🚗 *Entrega:* ${formatDate(inv.deliveryDate)}\n`;
        msg += `\n*Detalle de Postres:*\n`;
        (inv.items || []).forEach(it => {
          msg += `• ${it.quantity}x ${it.name} — ${formatRD(it.total)}\n`;
        });
        if (Number(inv.shippingFee) > 0) {
          msg += `• Envío a Domicilio — ${formatRD(inv.shippingFee)}\n`;
        }
        msg += `\n💰 *Total:* ${formatRD(inv.calculation?.total)}\n`;
        msg += `📌 *Estado de Pago:* ${inv.paymentStatus === 'Pagada' ? 'PAGADA ✓' : 'PENDIENTE'}\n\n`;
        msg += `¡Gracias por elegir a LeRoss Bakery!`;

        const phone = (inv.customer?.phone || "").replace(/\D/g, "");
        const url = phone ? `https://wa.me/1${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, "_blank");
      };

      // =============================================================
      // 3. MENÚ (800x800 RETINA)
      // =============================================================
      const [isAddingProduct, setIsAddingProduct] = useState(false);
      const [prodName, setProdName] = useState("");
      const [prodCategory, setProdCategory] = useState("Tres Leches");
      const [prodPrice, setProdPrice] = useState("");
      const [prodDesc, setProdDesc] = useState("");
      const [prodImage, setProdImage] = useState("");

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 800;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
            setProdImage(dataUrl);
            showToast("Foto optimizada (800x800)");
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodName.trim()) return alert("Indica el nombre del postre.");
        if (Number(prodPrice) <= 0) return alert("Indica un precio válido.");

        const newProd = {
          id: "prod_" + Date.now(),
          name: prodName.trim(),
          category: prodCategory,
          price: Number(prodPrice),
          description: prodDesc.trim(),
          image: prodImage,
          available: true
        };

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              products: [newProd, ...(data.products || [])]
            });
            setIsAddingProduct(false);
            setProdName("");
            setProdPrice("");
            setProdDesc("");
            setProdImage("");
            showToast("Postre añadido al menú");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleToggleProductAvailability = async (prodId, current) => {
        const updated = (data.products || []).map(p => p.id === prodId ? { ...p, available: !current } : p);
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({ products: updated });
            showToast("Disponibilidad actualizada");
          }
        } catch (err) {
          console.error(err);
        }
      };

      // =============================================================
      // 4. FINANZAS
      // =============================================================
      const [selectedPeriod, setSelectedPeriod] = useState("all");
      const [expenseDate, setExpenseDate] = useState(new Date().toISOString().split("T")[0]);
      const [expenseCategory, setExpenseCategory] = useState("Ingredientes");
      const [expenseDescription, setExpenseDescription] = useState("");
      const [expenseAmount, setExpenseAmount] = useState("");

      const financialMetrics = useMemo(() => {
        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

        const filteredInvoices = (data.invoices || []).filter(inv => {
          if (inv.state === "Anulada") return false;
          if (selectedPeriod === "currentMonth") return (inv.date || "").startsWith(currentYearMonth);
          return true;
        });

        const grossRevenue = filteredInvoices
          .filter(i => i.paymentStatus === "Pagada")
          .reduce((acc, i) => acc + Number(i.calculation?.total || 0), 0);

        const pendingReceivables = filteredInvoices
          .filter(i => i.paymentStatus === "Pendiente")
          .reduce((acc, i) => acc + Number(i.calculation?.total || 0), 0);

        const filteredExpenses = (data.expenses || []).filter(exp => {
          if (selectedPeriod === "currentMonth") return (exp.date || "").startsWith(currentYearMonth);
          return true;
        });

        const totalExpenses = filteredExpenses.reduce((acc, e) => acc + Number(e.amount || 0), 0);

        const expensesByCategory = { Ingredientes: 0, Empaques: 0, Operativo: 0, Herramientas: 0 };
        filteredExpenses.forEach(e => {
          const cat = e.category || "Ingredientes";
          if (expensesByCategory[cat] !== undefined) expensesByCategory[cat] += Number(e.amount || 0);
          else expensesByCategory["Operativo"] += Number(e.amount || 0);
        });

        const operatingIncome = grossRevenue - totalExpenses;
        const operatingMarginPct = grossRevenue > 0 ? Math.round((operatingIncome / grossRevenue) * 100) : 0;

        return {
          grossRevenue,
          pendingReceivables,
          totalExpenses,
          expensesByCategory,
          operatingIncome,
          operatingMarginPct,
          paidInvoicesCount: filteredInvoices.filter(i => i.paymentStatus === "Pagada").length,
          expensesCount: filteredExpenses.length
        };
      }, [data.invoices, data.expenses, selectedPeriod]);

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const amt = Number(expenseAmount);
        if (!amt || amt <= 0) return alert("Indica un monto válido.");
        if (!expenseDescription.trim()) return alert("Indica una descripción.");

        const newExp = {
          id: "exp_" + Date.now(),
          date: expenseDate,
          category: expenseCategory,
          description: expenseDescription.trim(),
          amount: amt,
          createdAt: new Date().toISOString()
        };

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              expenses: [newExp, ...(data.expenses || [])]
            });
            setExpenseDescription("");
            setExpenseAmount("");
            showToast("Gasto guardado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleDeleteExpense = async (expId) => {
        if (!confirm("¿Eliminar este gasto?")) return;
        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              expenses: (data.expenses || []).filter(e => e.id !== expId)
            });
            showToast("Gasto eliminado");
          }
        } catch (err) {
          console.error(err);
        }
      };

      // =============================================================
      // 5. SIMULADOR DE COSTOS
      // =============================================================
      const [simMode, setSimMode] = useState("batch");

      // MODO TANDA (SALES VALUE ALLOCATION)
      const [batchTitle, setBatchTitle] = useState("Tanda Bizcocho Vainilla");
      const [bowlCost, setBowlCost] = useState("1054");
      const [batchItems, setBatchItems] = useState([
        { id: 1, name: "Bizcocho 1 lb", quantity: 1, sellingPrice: 2700, packagingCost: 180 },
        { id: 2, name: "Bizcocho Personal", quantity: 2, sellingPrice: 350, packagingCost: 40 }
      ]);

      const updateBatchItem = (id, field, val) => {
        setBatchItems(prev => prev.map(item => item.id === id ? { ...item, [field]: val } : item));
      };

      const addBatchItem = () => {
        setBatchItems(prev => [
          ...prev,
          { id: Date.now(), name: "Nuevo Tamaño", quantity: 1, sellingPrice: 500, packagingCost: 50 }
        ]);
      };

      const removeBatchItem = (id) => {
        if (batchItems.length <= 1) return;
        setBatchItems(prev => prev.filter(i => i.id !== id));
      };

      const batchMetrics = useMemo(() => {
        const totalBowlRaw = Number(bowlCost || 0);
        let totalBatchRevenue = 0;
        let totalPackagingCost = 0;

        batchItems.forEach(item => {
          const qty = Number(item.quantity || 1);
          const price = Number(item.sellingPrice || 0);
          const pkg = Number(item.packagingCost || 0);
          totalBatchRevenue += qty * price;
          totalPackagingCost += qty * pkg;
        });

        const itemsWithAllocation = batchItems.map(item => {
          const qty = Number(item.quantity || 1);
          const unitPrice = Number(item.sellingPrice || 0);
          const groupRevenue = qty * unitPrice;
          const unitPkg = Number(item.packagingCost || 0);

          const revenueShareRatio = totalBatchRevenue > 0 ? (groupRevenue / totalBatchRevenue) : 0;
          const revenueSharePct = Math.round(revenueShareRatio * 100);

          const groupBatterCost = totalBowlRaw * revenueShareRatio;
          const unitBatterCost = qty > 0 ? (groupBatterCost / qty) : 0;
          const unitTotalCost = unitBatterCost + unitPkg;

          const unitProfit = unitPrice - unitTotalCost;
          const unitMarginPct = unitPrice > 0 ? Math.round((unitProfit / unitPrice) * 100) : 0;

          return {
            ...item,
            groupRevenue,
            revenueSharePct,
            unitBatterCost,
            unitTotalCost,
            unitProfit,
            unitMarginPct
          };
        });

        const totalBatchCost = totalBowlRaw + totalPackagingCost;
        const totalBatchProfit = totalBatchRevenue - totalBatchCost;
        const totalBatchMarginPct = totalBatchRevenue > 0 ? Math.round((totalBatchProfit / totalBatchRevenue) * 100) : 0;

        return {
          totalBatchRevenue,
          totalBatchCost,
          totalBatchProfit,
          totalBatchMarginPct,
          itemsWithAllocation
        };
      }, [bowlCost, batchItems]);

      const handleSaveBatchSimulation = async () => {
        if (!batchTitle.trim()) return alert("Indica un nombre para la tanda.");
        if (Number(bowlCost) <= 0) return alert("Indica el costo del tazón.");

        const record = {
          id: "sim_batch_" + Date.now(),
          type: "batch",
          title: batchTitle.trim(),
          date: new Date().toISOString().split("T")[0],
          bowlCost: Number(bowlCost),
          items: batchMetrics.itemsWithAllocation,
          totalBatchCost: batchMetrics.totalBatchCost,
          totalBatchRevenue: batchMetrics.totalBatchRevenue,
          totalBatchProfit: batchMetrics.totalBatchProfit,
          totalMarginPct: batchMetrics.totalBatchMarginPct
        };

        try {
          if (db) {
            await db.collection("leross_app").doc("main_data").update({
              simulations: [record, ...(data.simulations || [])]
            });
            showToast("Tanda guardada en el recetario");

        const pkg = Number(singlePackaging || 0);

        if (totalCost <= 0) return null;

        const marginRatio = singleMargin / 100;
        const suggestedPrice = marginRatio < 1 ? Math.round(totalCost / (1 - marginRatio)) : 0;
        const profit = suggestedPrice - totalCost;
        const markup = totalCost > 0 ? Math.round((profit / totalCost) * 100) : 0;

        const actualP = Number(singleActualPrice || 0);
        const actualProfit = actualP > 0 ? (actualP - totalCost) : 0;
        const actualMarginPct = actualP > 0 ? Math.round(((actualP - totalCost) / actualP) * 100) : 0;

        return {
          totalCost,
          suggestedPrice,
          profit,
          markup,
          actualProfit,
          actualMarginPct
        };
      }, [singleIngredients, singlePackaging, singleLaborGas, singleMargin, singleActualPrice]);

                        className="w-full bg-brand-charcoal text-white text-xs font-bold py-2.5 rounded-xl"
                      >
                        💾 Guardar Receta Individual
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* Recetario Guardado */}
              <div className="bg-white p-5 rounded-3xl border border-brand-border space-y-3 shadow-xs">
                <h3 className="text-sm font-bold text-brand-charcoal">Recetario & Tandas Guardadas</h3>
                
                <div className="space-y-2.5">
                  {(data.simulations || []).map(sim => (
                    <div key={sim.id} className="p-3.5 rounded-2xl bg-brand-softBg border border-brand-border flex justify-between items-center text-xs">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-brand-charcoal">{sim.title}</span>
                          <span className="text-[9px] bg-white text-brand-darkPink font-bold px-1.5 py-0.5 rounded border border-brand-border">
                            {sim.type === "batch" ? "Tanda" : "Individual"}
                          </span>
                        </div>
                        <span className="text-[10px] text-gray-400">{formatDate(sim.date)}</span>
                      </div>

                      <div className="flex items-center space-x-3">
                        <span className="font-bold text-emerald-700">+{formatWholeRD(sim.totalBatchProfit || sim.profit)}</span>
                        <button onClick={() => handleDeleteSimulation(sim.id)} className="text-gray-400 hover:text-rose-500">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          )}

          {/* ======================================================== */}
          {/* BARRA INFERIOR APPLE FIJA (5 COLUMNAS SIN SCROLL)        */}
          {/* ======================================================== */}
          <nav id="bottom-tab-bar" className="fixed bottom-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-xl border-t border-brand-border/80 pb-[max(env(safe-area-inset-bottom),10px)] pt-2 shadow-[0_-4px_24px_rgba(0,0,0,0.04)]">
            <div className="max-w-2xl mx-auto grid grid-cols-5 text-center px-1">
              
              <button
                type="button"
                onClick={() => setTab("webOrders")}
                className={`relative flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'webOrders' ? 'text-brand-darkPink font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <div className="relative">
                  <span className="text-lg">📥</span>
                  {pendingWebOrders.length > 0 && (
                    <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center border-2 border-white shadow-xs animate-pulse">
                      {pendingWebOrders.length}
                    </span>
                  )}
                </div>
                <span className="text-[9.5px] leading-tight block mt-0.5">Pedidos Web</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("invoices")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'invoices' ? 'text-brand-darkPink font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">📋</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Facturas</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("menu")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'menu' ? 'text-brand-darkPink font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">🧁</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Menú</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("finances")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'finances' ? 'text-brand-darkPink font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">📊</span>
                <span className="text-[9.5px] leading-tight block mt-0.5">Finanzas</span>
              </button>

              <button
                type="button"
                onClick={() => setTab("simulator")}
                className={`flex flex-col items-center justify-center py-1 transition-all ${
                  tab === 'simulator' ? 'text-brand-darkPink font-bold' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                <span className="text-lg">🧮</span>
                <span className="text-[9px] leading-[11px] block mt-0.5 text-center">Simulador de Costos</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
