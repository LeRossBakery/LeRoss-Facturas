  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const formatRD = (val) => "RD$ " + Number(val || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    };

    // Formateador Estricto RD (XXX-XXX-XXXX)
    const formatPhoneInput = (val) => {
      if (!val) return "";
      let digits = String(val).replace(/\D/g, "");
      if (digits.startsWith("1") && digits.length > 10) {
        digits = digits.slice(1);
      }
      digits = digits.slice(0, 10);
      if (digits.length <= 3) return digits;
      if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
      return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
    };

    const normalizePhone = (phone) => {
      if (!phone) return "";
      const digits = String(phone).replace(/\D/g, "");
      return digits.length >= 10 ? digits.slice(-10) : digits;
    };

    const formatBirthday = (dateStr) => {
      if (!dateStr) return "";
      const parts = dateStr.split("-");
      if (parts.length < 3) return dateStr;
      const months = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
      const day = parseInt(parts[2], 10);
      const month = months[parseInt(parts[1], 10) - 1] || "";
      return `${day} de ${month}`;
    };

    const copyToClipboard = (text) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(textArea);
      return Promise.resolve();
    };

    const playNotificationSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}
    };

    const compressImage = (file, maxWidth = 800, maxHeight = 800) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round(height * (maxWidth / width));
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round(width * (maxHeight / height));
                height = maxHeight;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
        };
      });
    };

    function App() {
      const [tab, setTab] = useState("invoices");
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("Pendiente");
      
      const [toastMsg, setToastMsg] = useState("");
      const [cloudStatus, setCloudStatus] = useState("connecting");
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const [rejectModalOrder, setRejectModalOrder] = useState(null);
      const [rejectionReasonText, setRejectionReasonText] = useState("");

      // Postres
      const [editingProductId, setEditingProductId] = useState(null);
      const [prodFormName, setProdFormName] = useState("");
      const [prodFormPrice, setProdFormPrice] = useState("");
      const [prodFormImage, setProdFormImage] = useState("");

      // Clientes
      const [customerSearch, setCustomerSearch] = useState("");
      const [editingCustomerId, setEditingCustomerId] = useState(null);
      const [custFormName, setCustFormName] = useState("");
      const [custFormPhone, setCustFormPhone] = useState("");
      const [custFormBirthday, setCustFormBirthday] = useState("");

      const prevDraftsCountRef = useRef(0);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const defaultState = {
        counter: 1,
        hasIssuedFirst: false,
        prefix: "FAC-",
        business: {
          name: "LeRoss Bakery",
          customLogo: "",
          phone: "849-441-1315",
          address: "Santo Domingo, D.N.",
          email: "contacto@lerossbakery.com",
          instagram: "@rossynellys",
          rnc: "",
          footerMsg: "¡Gracias por endulzar tus momentos con nosotros! 🧁",
          paymentInstructions: "Banco Popular / Banreservas / BHD\nCuenta de Ahorros: 000-000000-0\nA nombre de: LeRoss Bakery\nPor favor enviar comprobante a este WhatsApp."
        },
        taxSettings: { applyITBIS: false, defaultRate: 18 },
        products: [
          { id: "p1", name: "Flan Tradicional Casero", price: 1200, exempt: false, image: "" },
          { id: "p2", name: "Caja Mini Brownies (12 uds)", price: 650, exempt: false, image: "" },
          { id: "p3", name: "Tres Leches Clásico Familiar", price: 1500, exempt: false, image: "" },
          { id: "p4", name: "Pudín Dominicano Decorado", price: 2400, exempt: false, image: "" }
        ],
        invoices: [],
        drafts: [],
        customers: []
      };

      const [state, setState] = useState(() => {
        const local = localStorage.getItem("leross_cloud_cache");
        return local ? JSON.parse(local) : defaultState;
      });

      useEffect(() => {
        if (!db) {
          setCloudStatus("local");
          return;
        }

        const unsubscribe = db.collection("leross_app").doc("main_data").onSnapshot(
          (doc) => {
            if (doc.exists) {
              const cloudData = doc.data();
              
              const newDraftsCount = (cloudData.drafts || []).length;
              if (prevDraftsCountRef.current > 0 && newDraftsCount > prevDraftsCountRef.current) {
                playNotificationSound();
                showToast("🔔 ¡Nuevo pedido web recibido!");
              }
              prevDraftsCountRef.current = newDraftsCount;

              setState({
                ...cloudData,
                customers: cloudData.customers || []
              });
              localStorage.setItem("leross_cloud_cache", JSON.stringify(cloudData));
              setCloudStatus("synced");
            } else {
              db.collection("leross_app").doc("main_data").set(defaultState);
              setCloudStatus("synced");
            }
          },
          (err) => {
            console.error("Firestore error:", err);
            setCloudStatus("error");
          }
        );

        return () => unsubscribe();
      }, []);

      const saveToCloud = (newState) => {
        setState(newState);
        localStorage.setItem("leross_cloud_cache", JSON.stringify(newState));
        if (db) {
          db.collection("leross_app").doc("main_data").set(newState).catch(err => {
            console.error("Cloud write failed:", err);
            showToast("Guardado solo local");
          });
        }
      };

      const [currentDraftId, setCurrentDraftId] = useState(null);
      const [draft, setDraft] = useState({
        customerName: "",
        customerPhone: "",
        date: new Date().toISOString().split("T")[0],
        deliveryDate: "",
        items: [{ id: 1, name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
        orderDiscountType: "amount",
        orderDiscountVal: 0,
        paymentStatus: "Pendiente",
        paymentMethod: "Transferencia",
        notes: ""
      });

      const customerSuggestions = useMemo(() => {
        const query = (draft.customerName || "").trim().toLowerCase();
        if (!query || query.length < 2) return [];
        return (state.customers || []).filter(c =>
          c.name.toLowerCase().includes(query) &&
          c.name.toLowerCase() !== query
        ).slice(0, 4);
      }, [draft.customerName, state.customers]);

      const findCustomerByPhone = (rawPhone) => {
        const norm = normalizePhone(rawPhone);
        if (!norm || norm.length < 10) return null;
        return (state.customers || []).find(c => normalizePhone(c.phone) === norm);
      };

      const calculation = useMemo(() => {
        let subtotal = 0;
        let taxableSubtotal = 0;

        const calculatedLines = (draft.items || []).map(item => {
          const raw = Number(item.quantity || 0) * Number(item.unitPrice || 0);
          let disc = item.discountType === "percent"
            ? raw * (Number(item.discountVal || 0) / 100)
            : Number(item.discountVal || 0);
          disc = Math.min(raw, Math.max(0, disc));
          const lineTotal = raw - disc;
          subtotal += lineTotal;
          if (!item.exempt) taxableSubtotal += lineTotal;
          return { ...item, lineSubtotal: raw, lineDiscount: disc, lineTotal };
        });

        let orderDisc = draft.orderDiscountType === "percent"
          ? subtotal * (Number(draft.orderDiscountVal || 0) / 100)
          : Number(draft.orderDiscountVal || 0);
        orderDisc = Math.min(subtotal, Math.max(0, orderDisc));
        const discountedSubtotal = subtotal - orderDisc;

        const effectiveTaxableRatio = subtotal > 0 ? (taxableSubtotal / subtotal) : 0;
        const finalTaxableBase = discountedSubtotal * effectiveTaxableRatio;
        const itbis = state.taxSettings.applyITBIS ? (finalTaxableBase * (state.taxSettings.defaultRate / 100)) : 0;
        const total = discountedSubtotal + itbis;

        return { lines: calculatedLines, subtotal, orderDiscount: orderDisc, discountedSubtotal, itbis, total };
      }, [draft, state.taxSettings]);

      const resetDraft = () => {
        setCurrentDraftId(null);
        setDraft({
          customerName: "",
          customerPhone: "",
          date: new Date().toISOString().split("T")[0],
          deliveryDate: "",
          items: [{ id: Date.now(), name: "", quantity: 1, unitPrice: 0, discountType: "amount", discountVal: 0, exempt: false }],
          orderDiscountType: "amount",
          orderDiscountVal: 0,
          paymentStatus: "Pendiente",
          paymentMethod: "Transferencia",
          notes: ""
        });
      };

      const startInvoicingWebOrder = (order) => {
        setCurrentDraftId(order.id);
        const matched = findCustomerByPhone(order.customerPhone);

        setDraft({
          ...order,
          customerName: matched ? matched.name : order.customerName,
          customerPhone: matched ? formatPhoneInput(matched.phone || order.customerPhone) : formatPhoneInput(order.customerPhone)
        });

        setTab("new");
        if (matched && matched.name.toLowerCase() !== order.customerName.toLowerCase()) {
          showToast(`Vinculado a ${matched.name}`);
        }
      };

      const acceptWebOrder = (order) => {
        const totalVal = order.calculation.total || 0;

        const updatedDrafts = (state.drafts || []).map(d => {
          if (d.id === order.id) {
            return { ...d, approvalStatus: "Aceptada" };
          }
          return d;
        });

        let updatedCustomers = [...(state.customers || [])];
        const orderPhoneNorm = normalizePhone(order.customerPhone);
        const existingIdx = updatedCustomers.findIndex(c => {
          const cPhoneNorm = normalizePhone(c.phone);
          const cNameNorm = c.name.trim().toLowerCase();
          return (cPhoneNorm && orderPhoneNorm && cPhoneNorm === orderPhoneNorm) || (cNameNorm === order.customerName.trim().toLowerCase());
        });

        if (existingIdx === -1 && order.customerName.trim()) {
          updatedCustomers.push({
            id: "cust_" + Date.now(),
            name: order.customerName.trim(),
            phone: formatPhoneInput(order.customerPhone),
            birthday: ""
          });
        }

        saveToCloud({ ...state, drafts: updatedDrafts, customers: updatedCustomers });

        const cleanPhone = (order.customerPhone || "").replace(/\D/g, "");
        const targetPhone = cleanPhone.length === 10 ? "1" + cleanPhone : cleanPhone;

        const waMsg = `🧁 *¡Hola, ${order.customerName}!* Te confirmamos con gusto de *LeRoss Bakery*.\n\n` +
          `✅ Tu pedido *#${order.orderNumber || 'Web'}* está *CONFIRMADO* para la fecha: *${order.deliveryDate || 'solicitada'}*.\n\n` +
          `📋 *Pago Total del Pedido:*\n` +
          `• Total a transferir (100%): *${formatRD(totalVal)}*\n\n` +
          `⏳ *Plazo de Reserva:* Dispones de *3 horas* para enviar el comprobante del 100% para iniciar la preparación y garantizar tu cupo en el horno.\n\n` +
          `💳 *Cuentas Bancarias:*\n${state.business.paymentInstructions}\n\n` +
          `¡Quedamos atentos a tu comprobante por aquí!`;

        const waUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(waMsg)}`;
        window.open(waUrl, "_blank");
        showToast("Pedido Aceptado — Abriendo WhatsApp");
      };

      const submitRejection = () => {
        if (!rejectModalOrder) return;
        const reason = rejectionReasonText.trim() || "Cupo lleno para la fecha solicitada";

        const updatedDrafts = (state.drafts || []).map(d => {
          if (d.id === rejectModalOrder.id) {
            return { ...d, approvalStatus: "Rechazada", rejectionReason: reason };
          }
          return d;
        });

        saveToCloud({ ...state, drafts: updatedDrafts });

        const cleanPhone = (rejectModalOrder.customerPhone || "").replace(/\D/g, "");
        const targetPhone = cleanPhone.length === 10 ? "1" + cleanPhone : cleanPhone;

        const waMsg = `🧁 *Hola, ${rejectModalOrder.customerName}.* Te escribimos de *LeRoss Bakery*.\n\n` +
          `Con respecto a tu solicitud de pedido #${rejectModalOrder.orderNumber || ''} para el *${rejectModalOrder.deliveryDate || ''}*, lamentablemente *no tenemos disponibilidad* debido a:\n` +
          `👉 *${reason}*.\n\n` +
          `Sentimos no poder servirte en esta ocasión y quedamos a tu completa orden para una próxima fecha especial. ¡Gracias por tenernos presentes!`;

        const waUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(waMsg)}`;
        setRejectModalOrder(null);
        setRejectionReasonText("");
        window.open(waUrl, "_blank");
        showToast("Pedido Rechazado — Notificado por WhatsApp");
      };

      const deleteDraft = (draftId) => {
        if (!confirm("¿Eliminar este registro de pedido?")) return;
        const updatedDrafts = (state.drafts || []).filter(d => d.id !== draftId);
        saveToCloud({ ...state, drafts: updatedDrafts });
        showToast("Pedido eliminado");
      };

      const emitInvoice = () => {
        if (!draft.customerName.trim()) {
          alert("Indique el nombre del cliente");
          return;
        }
        if (calculation.total <= 0) {
          alert("El total debe ser mayor a RD$ 0");
          return;
        }

        const invoiceNumber = `${state.prefix}${String(state.counter).padStart(4, "0")}`;
        const newInvoice = {
          ...draft,
          id: "inv_" + Date.now(),
          number: invoiceNumber,
          state: "Emitida",
          calculation,
          createdAt: new Date().toISOString()
        };

        const filteredDrafts = (state.drafts || []).filter(d => d.id !== currentDraftId);

        let updatedCustomers = [...(state.customers || [])];
        const draftPhoneNorm = normalizePhone(draft.customerPhone);
        const draftNameNorm = draft.customerName.trim().toLowerCase();

        const matchIdx = updatedCustomers.findIndex(c => {
          const cPhoneNorm = normalizePhone(c.phone);
          const cNameNorm = c.name.trim().toLowerCase();
          return (cPhoneNorm && draftPhoneNorm && cPhoneNorm === draftPhoneNorm) || (cNameNorm === draftNameNorm);
        });

        if (matchIdx >= 0) {
          updatedCustomers[matchIdx] = {
            ...updatedCustomers[matchIdx],
            name: draft.customerName.trim(),
            phone: formatPhoneInput(draft.customerPhone) || updatedCustomers[matchIdx].phone
          };
        } else if (draft.customerName.trim()) {
          updatedCustomers.push({
            id: "cust_" + Date.now(),
            name: draft.customerName.trim(),
            phone: formatPhoneInput(draft.customerPhone),
            birthday: ""
          });
        }

        saveToCloud({
          ...state,
          counter: state.counter + 1,
          hasIssuedFirst: true,
          invoices: [newInvoice, ...state.invoices],
          drafts: filteredDrafts,
          customers: updatedCustomers
        });

        setSelectedInvoice(newInvoice);
        setTab("view");
        showToast(`Factura ${invoiceNumber} emitida`);
      };

      const voidInvoice = (invId) => {
        if (!confirm("¿Está seguro de anular esta factura?")) return;
        saveToCloud({
          ...state,
          invoices: state.invoices.map(inv => inv.id === invId ? { ...inv, state: "Anulada" } : inv)

        if (selectedInvoice && selectedInvoice.id === invId) {
          setSelectedInvoice(prev => ({ ...prev, state: "Anulada" }));

        setSelectedInvoice(null);
        setTab("invoices");
        showToast("Factura eliminada permanentemente");

          ...state,
          invoices: state.invoices.map(inv => inv.id === invId ? { ...inv, paymentStatus: "Pagada" } : inv)

      // MENSAJE WHATSAPP: "Factura: FAC-XXXX" (Sin "Oficial")
      const shareWhatsApp = (inv) => {
        const cleanPhone = (inv.customerPhone || "").replace(/\D/g, "");
        let targetPhone = "";
        if (cleanPhone.length === 10) targetPhone = "1" + cleanPhone;
        else if (cleanPhone.length === 11 && cleanPhone.startsWith("1")) targetPhone = cleanPhone;

        const itemsText = inv.calculation.lines.map(l => `• ${l.quantity}x ${l.name} — ${formatRD(l.lineTotal)}`).join("\n");
        const message = `🧁 *${state.business.name}*\n` +
          `Factura: *${inv.number}*\n` +
          `Fecha: ${formatDate(inv.date)}\n` +
          `Cliente: *${inv.customerName}*\n\n` +
          `📋 *Detalle del Pedido:*\n${itemsText}\n\n` +
          `*Total: ${formatRD(inv.calculation.total)}*\n` +
          `*Estado de Pago:* ${inv.paymentStatus === 'Pagada' ? '✅ Pagada' : '⏳ Pendiente'}\n` +
          (inv.paymentStatus === 'Pendiente' ? `\n💳 *Datos de Pago:*\n${state.business.paymentInstructions}\n` : '') +
          `\n${state.business.footerMsg}`;

        const url = targetPhone 
          ? `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`
          : `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      };

      const handlePrintOrPdf = async (inv) => {
        const element = document.getElementById("print-area");
        if (!element) return;

        setIsGeneratingPdf(true);
        showToast("Generando PDF...");

        const opt = {
          margin: [8, 8, 8, 8],
          filename: `${inv.number || 'Factura'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2.5, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' }
        };

        try {
          if (window.html2pdf) {
            const worker = window.html2pdf().set(opt).from(element);
            const pdfBlob = await worker.outputPdf('blob');
            const pdfFile = new File([pdfBlob], `${inv.number}.pdf`, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
              await navigator.share({
                files: [pdfFile],
                title: `${inv.number} - LeRoss Bakery`,
                text: `Factura ${inv.number}`
              });
              showToast("PDF compartido");
            } else {
              await window.html2pdf().set(opt).from(element).save();
              showToast("PDF descargado");
            }
          } else {
            window.print();
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error("PDF error:", err);
            window.print();
          }
        } finally {
          setIsGeneratingPdf(false);
        }

                  )}
                </div>

                <div className="no-print space-y-2 pt-2">
                  <div className="flex space-x-2">
                    {selectedInvoice.state !== "Anulada" ? (
                      <>
                        {selectedInvoice.paymentStatus === "Pendiente" && (
                          <button
                            onClick={() => markAsPaid(selectedInvoice.id)}
                            className="flex-1 bg-emerald-50 text-emerald-600 py-2.5 rounded-xl text-xs font-bold border border-emerald-200 active:scale-95"
                          >
                            Marcar como Pagada
                          </button>
                        )}
                        <button
                          onClick={() => voidInvoice(selectedInvoice.id)}
                          className="text-xs text-rose-500 py-2.5 px-4 rounded-xl border border-rose-200 hover:bg-rose-50 font-bold active:scale-95"
                        >
                          Anular Factura
                        </button>
                      </>
                    ) : (
                      <button
                        onClick={() => permanentlyDeleteInvoice(selectedInvoice.id)}
                        className="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm active:scale-95"
                      >
                        🗑️ Eliminar Definitivamente
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal Rechazo Pedido */}
          {rejectModalOrder && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-5 w-full max-w-sm space-y-3.5 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sm text-brand-charcoal">Rechazar Pedido</h3>
                  <button onClick={() => setRejectModalOrder(null)} className="text-gray-400 font-bold text-xs p-1">✕</button>
                </div>

                <p className="text-xs text-gray-500">
                  Selecciona o escribe el motivo para {rejectModalOrder.customerName}:
                </p>

                <div className="space-y-1.5">
                  {[
                    "Cupo lleno en el horno para esa fecha",
                    "Tiempo de anticipación insuficiente",
                    "Fuera de rango de horario de entrega",
                    "Ingrediente especial no disponible"
                  ].map((preset, idx) => (
                    <button
                      key={idx}
                      onClick={() => setRejectionReasonText(preset)}
                      className="w-full text-left text-[11px] p-2 rounded-xl bg-brand-softBg hover:bg-brand-softPink border border-brand-border text-brand-charcoal transition-colors block"
                    >
                      • {preset}
                    </button>
                  ))}
                </div>

                <input
                  type="text"
                  placeholder="Otro motivo..."
                  value={rejectionReasonText}
                  onChange={e => setRejectionReasonText(e.target.value)}
                  className="w-full bg-brand-softBg border border-brand-border rounded-xl px-3 py-2 text-xs outline-none"
                />

                <div className="flex space-x-2 pt-1">
                  <button
                    onClick={() => setRejectModalOrder(null)}
                    className="flex-1 bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={submitRejection}
                    className="flex-1 bg-rose-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md"
                  >
                    Enviar Rechazo
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Barra de Navegación Fija con 5 Pestañas */}
          <nav className="no-print flex-shrink-0 bg-white/95 backdrop-blur-md border-t border-brand-border flex justify-around py-2.5 pb-[max(0.6rem,env(safe-area-inset-bottom))] z-30 shadow-lg">
            <button
              onClick={() => setTab("invoices")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'invoices' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">📋</span>
              Facturas
            </button>
            <button
              onClick={() => {
                resetDraft();
                setTab("new");
              }}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'new' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">➕</span>
              Nueva
            </button>
            <button
              onClick={() => setTab("customers")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'customers' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">👥</span>
              Clientes
            </button>
            <button
              onClick={() => setTab("products")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'products' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">🧁</span>
              Menú
            </button>
            <button
              onClick={() => setTab("settings")}
              className={`flex flex-col items-center text-[10px] font-bold ${tab === 'settings' ? 'text-brand-darkPink' : 'text-gray-400'}`}
            >
              <span className="text-lg">⚙️</span>
              Ajustes
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
